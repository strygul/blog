<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Timeline of regional casting traditions and the tetsubin</title>
  <desc id="desc">Two tracks separate older regional casting histories from the later emergence and spread of the tetsubin.</desc>
  <rect width="1200" height="700" fill="#faf8f4"/>
  <style>
    text{fill:#2b2b2b;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.track{stroke:#2b2b2b;stroke-width:5}.rust{fill:#8b4a32}.blue{fill:#496b78}.tick{stroke:#2b2b2b;stroke-width:3}.small{font-size:17px}.date{font-size:20px;font-weight:700}.tracklabel{font-size:23px;font-weight:700}
  </style>
  <text x="55" y="60" class="serif" font-size="38" font-weight="700">One timeline, two different histories</text>
  <text x="55" y="94" font-size="20">A casting tradition can predate the object it later became famous for.</text>
  <text x="55" y="188" class="tracklabel">regional casting traditions</text>
  <line x1="360" y1="180" x2="1140" y2="180" class="track"/>
  <g><circle cx="400" cy="180" r="11" class="blue"/><text x="400" y="137" text-anchor="middle" class="date">12th c.</text><text x="400" y="221" text-anchor="middle" class="small">Mizusawa / Ōshū</text><text x="400" y="244" text-anchor="middle" class="small">casting tradition</text></g>
  <g><circle cx="590" cy="180" r="11" class="blue"/><text x="590" y="137" text-anchor="middle" class="date">17th c.</text><text x="590" y="221" text-anchor="middle" class="small">Morioka chagama;</text><text x="590" y="244" text-anchor="middle" class="small">Yamagata consolidation</text></g>
  <g><circle cx="770" cy="180" r="11" class="blue"/><text x="770" y="137" text-anchor="middle" class="date">1611 onward</text><text x="770" y="221" text-anchor="middle" class="small">Takaoka metalwork</text><text x="770" y="244" text-anchor="middle" class="small">and specialist network</text></g>
  <g><circle cx="1010" cy="180" r="11" class="blue"/><text x="1010" y="137" text-anchor="middle" class="date">1975</text><text x="1010" y="221" text-anchor="middle" class="small">first national traditional-</text><text x="1010" y="244" text-anchor="middle" class="small">craft designations</text></g>
  <text x="55" y="365" class="tracklabel">tetsubin as an object</text>
  <line x1="300" y1="357" x2="1140" y2="357" class="track"/>
  <g><path d="M390 357l13-13 13 13-13 13z" class="rust"/><text x="403" y="314" text-anchor="middle" class="date">18th c.</text><text x="403" y="399" text-anchor="middle" class="small">emergence; exact first</text><text x="403" y="422" text-anchor="middle" class="small">maker and date uncertain</text></g>
  <g><circle cx="635" cy="357" r="11" class="rust"/><text x="635" y="314" text-anchor="middle" class="date">late Edo–Meiji</text><text x="635" y="399" text-anchor="middle" class="small">household expansion and</text><text x="635" y="422" text-anchor="middle" class="small">Kyoto art-kettle culture</text></g>
  <g><circle cx="820" cy="357" r="11" class="rust"/><text x="820" y="314" text-anchor="middle" class="date">1938–45</text><text x="820" y="399" text-anchor="middle" class="small">iron controls and</text><text x="820" y="422" text-anchor="middle" class="small">wartime disruption</text></g>
  <g><circle cx="1060" cy="357" r="11" class="rust"/><text x="1060" y="314" text-anchor="middle" class="date">present</text><text x="1060" y="399" text-anchor="middle" class="small">regional revivals and</text><text x="1060" y="422" text-anchor="middle" class="small">new interpretations</text></g>
  <rect x="55" y="505" width="1090" height="122" rx="18" fill="#f1ede6"/>
  <text x="82" y="543" class="serif" font-size="25" font-weight="700">How to read the uncertain point</text>
  <path d="M90 580l13-13 13 13-13 13z" class="rust"/><text x="130" y="586" font-size="18">The diamond marks an approximate emergence, not a documented invention year.</text>
  <text x="130" y="614" font-size="18">The circa-1750 Koizumi account is a Morioka tradition, not proof of Japan’s first tetsubin.</text>
</svg>
