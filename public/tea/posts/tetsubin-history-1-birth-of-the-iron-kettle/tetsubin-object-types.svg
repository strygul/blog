<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Four Japanese iron vessels often confused with the tetsubin</title>
  <desc id="desc">Silhouettes compare the chagama, tedorikama, tetsubin, and enamelled iron kyusu by their handles, spouts, coatings, and intended use.</desc>
  <rect width="1200" height="700" fill="#faf8f4"/>
  <style>
    text{fill:#2b2b2b;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.vessel{fill:#2b2b2b}.line{fill:none;stroke:#2b2b2b;stroke-width:13;stroke-linecap:round}.rust{fill:#8b4a32}.blue{fill:#496b78}.small{font-size:16.5px}.label{font-size:29px;font-weight:700}.jp{font-size:19px;fill:#8b4a32}.rule{stroke:#d7d1c7;stroke-width:2}
  </style>
  <text x="60" y="62" class="serif" font-size="38" font-weight="700">Four objects that should not share one name</text>
  <text x="60" y="96" font-size="20">Shape tells you what the vessel is meant to do.</text>
  <line x1="300" y1="125" x2="300" y2="640" class="rule"/><line x1="600" y1="125" x2="600" y2="640" class="rule"/><line x1="900" y1="125" x2="900" y2="640" class="rule"/>
  <g transform="translate(35)">
    <path d="M55 286 Q65 205 150 190 Q235 205 245 286 L230 410 Q150 448 70 410Z" class="vessel"/>
    <rect x="82" y="170" width="136" height="28" rx="14" class="vessel"/>
    <path d="M96 173 Q150 122 204 173" class="line" stroke-width="8"/>
    <rect x="135" y="143" width="30" height="25" rx="8" class="rust"/>
    <text x="150" y="490" text-anchor="middle" class="label serif">chagama</text>
    <text x="150" y="518" text-anchor="middle" class="jp">茶釜</text>
    <text x="150" y="557" text-anchor="middle" class="small">No spout · no carrying handle</text>
    <text x="150" y="584" text-anchor="middle" class="small">Water is ladled from the mouth</text>
    <text x="150" y="611" text-anchor="middle" class="small blue">hearth / formal chanoyu</text>
  </g>
  <g transform="translate(325)">
    <path d="M50 295 Q60 220 150 202 Q240 220 250 295 L230 410 Q150 445 70 410Z" class="vessel"/>
    <rect x="85" y="180" width="130" height="28" rx="14" class="vessel"/>
    <path d="M93 204 Q150 91 207 204" class="line"/>
    <rect x="135" y="153" width="30" height="25" rx="8" class="rust"/>
    <text x="150" y="490" text-anchor="middle" class="label serif">tedorikama</text>
    <text x="150" y="518" text-anchor="middle" class="jp">手取釜</text>
    <text x="150" y="557" text-anchor="middle" class="small">Overhead handle · usually no spout</text>
    <text x="150" y="584" text-anchor="middle" class="small">A portable handled kama</text>
    <text x="150" y="611" text-anchor="middle" class="small blue">boiling and carrying water</text>
  </g>
  <g transform="translate(620)">
    <path d="M45 300 Q55 220 145 205 Q235 220 245 300 L225 410 Q145 445 65 410Z" class="vessel"/>
    <path d="M224 252 Q283 258 280 285 Q245 285 230 315Z" class="vessel"/>
    <rect x="82" y="182" width="126" height="28" rx="14" class="vessel"/>
    <path d="M86 210 Q145 72 214 210" class="line"/>
    <rect x="130" y="154" width="30" height="25" rx="8" class="rust"/>
    <text x="150" y="490" text-anchor="middle" class="label serif">tetsubin</text>
    <text x="150" y="518" text-anchor="middle" class="jp">鉄瓶</text>
    <text x="150" y="557" text-anchor="middle" class="small">Spout · overhead handle</text>
    <text x="150" y="584" text-anchor="middle" class="small">Un-enamelled interior</text>
    <text x="150" y="611" text-anchor="middle" class="small blue">boiling and pouring water</text>
  </g>
  <g transform="translate(925)">
    <path d="M35 310 Q50 235 135 220 Q220 235 235 310 L215 407 Q135 440 55 407Z" class="vessel"/>
    <path d="M214 267 Q273 270 270 295 Q240 296 220 325Z" class="vessel"/>
    <path d="M67 226 Q135 105 203 226" class="line"/>
    <path d="M68 312 Q78 250 135 243 Q192 250 202 312 L189 390 Q135 415 81 390Z" fill="#496b78"/>
    <rect x="76" y="199" width="118" height="27" rx="14" class="vessel"/>
    <text x="135" y="490" text-anchor="middle" class="label serif">iron kyūsu</text>
    <text x="135" y="518" text-anchor="middle" class="jp">鉄急須</text>
    <text x="135" y="557" text-anchor="middle" class="small">Spout · handle · blue interior</text>
    <text x="135" y="584" text-anchor="middle" class="small">Enamelled to hold brewed tea</text>
    <text x="135" y="611" text-anchor="middle" class="small blue">steeping, not boiling</text>
  </g>
</svg>
