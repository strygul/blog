<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Map of Japanese regions important to tetsubin history</title>
  <desc id="desc">A schematic map labels Morioka, Mizusawa and Oshu, Yamagata, Kyoto and Omi, and Takaoka, distinguishing early centers, the modern Nambu umbrella, art-metal centers, and reinterpretation centers.</desc>
  <rect width="1200" height="700" fill="#faf8f4"/>
  <style>
    text{fill:#2b2b2b;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.land{fill:#e8e3da;stroke:#2b2b2b;stroke-width:3}.route{fill:none;stroke:#b7afa3;stroke-width:3;stroke-dasharray:8 8}.rust{fill:#8b4a32}.blue{fill:#496b78}.label{font-size:22px;font-weight:700}.small{font-size:16px}.leader{stroke:#2b2b2b;stroke-width:2}
  </style>
  <text x="55" y="58" class="serif" font-size="38" font-weight="700">Several centers, not one straight lineage</text>
  <text x="55" y="91" font-size="20">Schematic geography: positions are approximate; historical roles are the point.</text>
  <path class="land" d="M640 120l75 35 46 71-12 76-58 70-42 79-28 110-60 62-55-19 20-70 47-51 19-99-35-66 20-84z"/>
  <path class="land" d="M425 492l89 20-13 63-104 35-104-5-61-43 55-37z"/>
  <path class="land" d="M160 565l68 6 37 31-57 39-73-19z"/>
  <path class="land" d="M720 118l27-33 22 27-17 43z"/>
  <path d="M646 166 Q610 240 590 320 Q540 425 445 535" class="route"/>
  <circle cx="664" cy="185" r="12" class="rust"/><line x1="676" y1="181" x2="810" y2="145" class="leader"/><text x="825" y="145" class="label">Morioka</text><text x="825" y="169" class="small">early chagama / tetsubin center</text>
  <circle cx="642" cy="244" r="12" class="blue"/><line x1="654" y1="247" x2="815" y2="254" class="leader"/><text x="830" y="252" class="label">Mizusawa / Ōshū</text><text x="830" y="276" class="small">older casting tradition; modern Nambu</text>
  <circle cx="575" cy="308" r="12" class="rust"/><line x1="565" y1="303" x2="430" y2="270" class="leader"/><text x="210" y="266" class="label">Yamagata</text><text x="210" y="290" class="small">old casting center; thin tea wares</text>
  <rect x="488" y="431" width="24" height="24" rx="3" class="blue"/><line x1="488" y1="443" x2="355" y2="421" class="leader"/><text x="123" y="418" class="label">Takaoka</text><text x="123" y="442" class="small">historic art-metal and inlay center</text>
  <path d="M408 538l13-13 13 13-13 13z" class="rust"/><line x1="408" y1="540" x2="300" y2="548" class="leader"/><text x="80" y="533" class="label">Kyoto / Ōmi</text><text x="80" y="557" class="small">art-kettle and reinterpretation center</text>
  <rect x="760" y="430" width="385" height="208" rx="18" fill="#f1ede6"/>
  <text x="788" y="470" class="serif" font-size="24" font-weight="700">Legend</text>
  <circle cx="800" cy="511" r="10" class="rust"/><text x="825" y="518" font-size="17">original / early center</text>
  <circle cx="800" cy="550" r="10" class="blue"/><text x="825" y="557" font-size="17">modern umbrella (Nambu)</text>
  <rect x="790" y="580" width="20" height="20" rx="3" class="blue"/><text x="825" y="597" font-size="17">historical art-metal center</text>
  <path d="M790 624l10-10 10 10-10 10z" class="rust"/><text x="825" y="630" font-size="17">reinterpretation / revival center</text>
</svg>
