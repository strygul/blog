<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">TAKAOKA PRODUCTION NETWORK</title><desc id="desc">Model, mould, casting, finishing, polishing, engraving or inlay, colouring, and assembly. Different specialists may perform different stages; a brand name does not identify every performer.</desc><rect width="1200" height="640" fill="#faf8f4"/><rect x="40" y="40" width="1120" height="560" rx="16" fill="#fffdf9" stroke="#2b2b2b" stroke-width="3"/><path d="M80 172H1120M80 452H1120" stroke="#8b4a32" stroke-width="4"/><text x="80" y="125" fill="#2b2b2b" font-family="Georgia, serif" font-size="42" font-weight="bold">TAKAOKA PRODUCTION NETWORK</text><text x="80" y="245" fill="#2b2b2b" font-family="Arial, sans-serif" font-size="25">Model → mould → casting → finishing → polishing</text><text x="80" y="283" fill="#2b2b2b" font-family="Arial, sans-serif" font-size="25">→ engraving / inlay → colouring → assembly</text><text x="80" y="355" fill="#496b78" font-family="Arial, sans-serif" font-size="25">Different specialists may perform different stages.</text><text x="80" y="393" fill="#496b78" font-family="Arial, sans-serif" font-size="25">A brand name does not identify every performer.</text><text x="80" y="530" fill="#8b4a32" font-family="Arial, sans-serif" font-size="22">SOURCE-GROUNDED SUMMARY · SEE ADJACENT HTML TABLE FOR THE FULL RECORD</text></svg>
