<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Oitomi seller maker attribution check</title><desc id="desc">A decision path distinguishes the seller Oitomi, an in-house product claim, a product explicitly credited to another workshop, and an unverified historical object.</desc><style>.bg{fill:#f4efe5}.head{font:700 31px Georgia,serif;fill:#231f1b}.h{font:700 19px Arial,sans-serif;fill:#fff}.body{font:16px Arial,sans-serif;fill:#28231f}.small{font:15px Arial,sans-serif;fill:#62594f}.card{fill:#fff;stroke:#c9bba7;stroke-width:2}.q{fill:#315d64}.yes{fill:#6f8d6a}.no{fill:#9b4f3f}.line{stroke:#887968;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#887968"/></marker></defs><rect class="bg" width="1200" height="600"/><text class="head" x="55" y="57">Oitomi: seller, workshop and object maker are different fields</text><rect class="q" x="390" y="95" width="420" height="70" rx="8"/><text class="h" x="600" y="138" text-anchor="middle">What does the product record actually say?</text><line class="line" x1="600" y1="165" x2="600" y2="218"/><rect class="card" x="420" y="230" width="360" height="70" rx="8"/><text class="body" x="455" y="272">Named artisan or outside workshop?</text><line class="line" x1="420" y1="265" x2="235" y2="350"/><line class="line" x1="780" y1="265" x2="965" y2="350"/><rect class="yes" x="55" y="365" width="360" height="100" rx="8"/><text class="h" x="82" y="400">YES</text><text class="h" x="82" y="434">credit that maker; Oitomi is seller</text><rect class="no" x="785" y="365" width="360" height="100" rx="8"/><text class="h" x="812" y="400">NO / UNSTATED</text><text class="h" x="812" y="434">do not fill the gap with the brand name</text><rect x="390" y="505" width="420" height="58" rx="8" fill="#d8b769"/><text class="body" x="438" y="540" style="font-weight:700">Seek SKU, receipt, box and workshop confirmation</text><line class="line" x1="235" y1="465" x2="478" y2="505"/><line class="line" x1="965" y1="465" x2="722" y2="505"/></svg>
