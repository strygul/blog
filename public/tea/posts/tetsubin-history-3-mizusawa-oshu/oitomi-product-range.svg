<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Oitomi product categories</title><desc id="desc">Oitomi's current catalogue separates unenameled water-boiling kettles, dual-use kettle and teapot forms, and teapot-only vessels, while named artisan listings may be from other workshops.</desc><style>.bg{fill:#f4efe5}.head{font:700 31px Georgia,serif;fill:#231f1b}.h{font:700 21px Arial,sans-serif;fill:#315d64}.body{font:16px Arial,sans-serif;fill:#28231f}.small{font:15px Arial,sans-serif;fill:#62594f}.card{fill:#fff;stroke:#c9bba7;stroke-width:2}.iron{fill:#3c3b39;stroke:#171615;stroke-width:5}.handle{fill:none;stroke:#292826;stroke-width:12}.tag{fill:#d8b769}</style><rect class="bg" width="1200" height="600"/><text class="head" x="55" y="58">Oitomi catalogue: function and maker credit come before style</text><g transform="translate(55 105)"><rect class="card" width="330" height="390" rx="8"/><path class="handle" d="M78 155 Q165 35 252 155"/><ellipse class="iron" cx="165" cy="207" rx="105" ry="76"/><path class="iron" d="M257 190 q54 5 48 43 q-28-3-53 11z"/><text class="h" x="25" y="315">Tetsubin</text><text class="body" x="25" y="345">water boiler; no enamel</text><text class="small" x="25" y="372">check finish and heating guidance</text></g><g transform="translate(435 105)"><rect class="card" width="330" height="390" rx="8"/><path class="handle" d="M86 168 Q165 58 244 168"/><ellipse class="iron" cx="165" cy="215" rx="94" ry="66"/><path class="iron" d="M248 199 q48 5 43 36 q-25-1-47 11z"/><circle class="tag" cx="165" cy="216" r="25"/><text class="h" x="25" y="315">Two-in-one</text><text class="body" x="25" y="345">boiler + removable strainer</text><text class="small" x="25" y="372">model-specific; do not assume enamel</text></g><g transform="translate(815 105)"><rect class="card" width="330" height="390" rx="8"/><path class="handle" d="M98 180 Q165 82 232 180"/><ellipse class="iron" cx="165" cy="221" rx="82" ry="58"/><path class="iron" d="M238 205 q45 4 39 31 q-22 0-42 10z"/><text class="h" x="25" y="315">Teapot-only</text><text class="body" x="25" y="345">tabletop steeping vessel</text><text class="small" x="25" y="372">different use and interior route</text></g><text class="small" x="55" y="555">Schematic silhouettes, not traced products. An Oitomi listing may explicitly credit another workshop or artisan.</text></svg>
