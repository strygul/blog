<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Morioka and Mizusawa followed separate paths before becoming Nambu ironware</title>
  <desc id="desc">Morioka developed under the Nambu domain around tea kettles and art casting. Mizusawa developed under the Date domain around practical cast goods. Their organizations joined in 1959, followed by national designation in 1975.</desc>
  <rect width="1200" height="720" fill="#f7f3ea"/>
  <text x="600" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#26231f">Two histories, one modern name</text>
  <rect x="70" y="120" width="500" height="390" rx="20" fill="#fff" stroke="#6b6257" stroke-width="3"/>
  <rect x="630" y="120" width="500" height="390" rx="20" fill="#fff" stroke="#6b6257" stroke-width="3"/>
  <text x="320" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#26231f">Morioka</text>
  <text x="880" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#26231f">Mizusawa / Ōshū</text>
  <text x="320" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#403a33">Nambu domain</text>
  <text x="320" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#403a33">Tea kettles and art casting</text>
  <text x="320" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#403a33">17th-century workshop roots</text>
  <text x="880" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#403a33">Date domain</text>
  <text x="880" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#403a33">Pots, cauldrons, daily goods</text>
  <text x="880" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#403a33">Older tradition, firmer later record</text>
  <path d="M320 510 L510 585 M880 510 L690 585" fill="none" stroke="#9b512d" stroke-width="7"/>
  <rect x="250" y="565" width="700" height="105" rx="18" fill="#9b512d"/>
  <text x="600" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">1959: the two cooperatives form one federation</text>
  <text x="600" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#fff">1975: national Nambu ironware designation</text>
</svg>
