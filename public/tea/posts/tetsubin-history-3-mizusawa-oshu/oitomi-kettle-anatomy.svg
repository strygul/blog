<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Oitomi kettle construction record</title><desc id="desc">A schematic complete kettle identifies the body, base, spout, lid, handle, interior, mark zone and provenance that must stay together for attribution.</desc><style>.bg{fill:#f4efe5}.head{font:700 31px Georgia,serif;fill:#231f1b}.h{font:700 18px Arial,sans-serif;fill:#315d64}.body{font:16px Arial,sans-serif;fill:#28231f}.small{font:15px Arial,sans-serif;fill:#62594f}.iron{fill:#3c3b39;stroke:#171615;stroke-width:6}.handle{fill:none;stroke:#292826;stroke-width:17}.call{stroke:#9b4f3f;stroke-width:3}.unknown{fill:#fff3d9;stroke:#d3a03c;stroke-width:2;stroke-dasharray:8 6}</style><rect class="bg" width="1200" height="640"/><text class="head" x="55" y="57">Oitomi attribution starts with the complete kettle</text><path class="handle" d="M280 330 Q480 60 680 330"/><ellipse class="iron" cx="480" cy="368" rx="210" ry="145"/><ellipse cx="480" cy="256" rx="90" ry="28" fill="#242321"/><ellipse cx="480" cy="249" rx="68" ry="20" fill="#68635c"/><path class="iron" d="M668 330 q155 10 133 85 q-75-4-151 37z"/><line class="call" x1="330" y1="225" x2="150" y2="153"/><text class="h" x="55" y="138">Handle</text><text class="small" x="55" y="161">fixed or movable; pairing unknown</text><line class="call" x1="480" y1="250" x2="480" y2="123"/><text class="h" x="416" y="104">Lid + knob</text><line class="call" x1="755" y1="363" x2="1005" y2="245"/><text class="h" x="1016" y="238">Spout</text><text class="small" x="1016" y="260">profile + seam</text><line class="call" x1="482" y1="438" x2="880" y2="516"/><text class="h" x="895" y="512">Base / mark zone</text><text class="small" x="895" y="535">location not established</text><line class="call" x1="310" y1="404" x2="125" y2="490"/><text class="h" x="55" y="488">Interior</text><text class="small" x="55" y="512">oxide, enamel, or other finish?</text><rect class="unknown" x="366" y="518" width="360" height="72" rx="8"/><text class="body" x="390" y="548">Keep whole-object photographs together.</text><text class="small" x="390" y="573">A detached mark cannot answer these questions.</text></svg>
