<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Oitomi chronology</title><desc id="desc">Four milestones record Oitomi's stated 1848 establishment as Hoshodo by Oikawa Rigenta, Date-clan kettle-maker claim, 1871 abolition of domains, and present Oshu activity. These are workshop history claims and do not authenticate unprovenanced objects.</desc><rect width="1200" height="400" fill="#f5f0e7"/><style>text{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;fill:#211d19}.t{font:700 38px Georgia,serif}.s{font-size:21px;fill:#665d53}.y{font-size:27px;font-weight:800;fill:#8a4b2a}.b{font-size:22px}.l{stroke:#9d7458;stroke-width:6}.d{fill:#8a4b2a;stroke:#f5f0e7;stroke-width:6}</style><text x="54" y="62" class="t">Oitomi / 及富 — chronology</text><text x="54" y="98" class="s">Workshop account; use as attributed house history unless an independent record establishes the same milestones.</text><line x1="105" y1="202" x2="1095" y2="202" class="l"/><g text-anchor="middle"><circle cx="160" cy="202" r="16" class="d"/><text x="160" y="160" class="y">1848</text><text x="160" y="250" class="b"><tspan x="160">Hoshodō founded</tspan><tspan x="160" dy="28">in Mizusawa</tspan></text><circle cx="450" cy="202" r="16" class="d"/><text x="450" y="160" class="y">Date service</text><text x="450" y="250" class="b"><tspan x="450">Founder described as</tspan><tspan x="450" dy="28">a kettle maker</tspan></text><circle cx="740" cy="202" r="16" class="d"/><text x="740" y="160" class="y">1871</text><text x="740" y="250" class="b"><tspan x="740">Domain patronage</tspan><tspan x="740" dy="28">ends</tspan></text><circle cx="1035" cy="202" r="16" class="d"/><text x="1035" y="160" class="y">Current</text><text x="1035" y="250" class="b"><tspan x="1035">Active Oshu</tspan><tspan x="1035" dy="28">workshop and shop</tspan></text></g><text x="54" y="365" class="s">A stated Date relationship explains local setting; it is not a shortcut for dating, identifying, or valuing a kettle.</text></svg>
