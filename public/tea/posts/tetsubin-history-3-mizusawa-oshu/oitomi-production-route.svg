<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Oitomi integrated production route</title><desc id="desc">Oitomi describes integrated moulding, cupola casting, grinding, high-temperature kettle baking, coloring and dispatch, while also selling fired-mould kettles credited to outside workshops.</desc><style>.bg{fill:#f4efe5}.head{font:700 31px Georgia,serif;fill:#231f1b}.n{font:700 22px Arial,sans-serif;fill:#fff}.h{font:700 18px Arial,sans-serif;fill:#315d64}.body{font:15px Arial,sans-serif;fill:#28231f}.card{fill:#fff;stroke:#c9bba7;stroke-width:2}.circle{fill:#315d64}.arrow{stroke:#887968;stroke-width:4;marker-end:url(#a)}.warn{fill:#fff3d9;stroke:#d3a03c;stroke-width:2}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#887968"/></marker></defs><rect class="bg" width="1200" height="640"/><text class="head" x="55" y="56">Oitomi: documented in-house chain, bounded by product credit</text><g transform="translate(55 115)"><rect class="card" width="180" height="150" rx="8"/><circle class="circle" cx="90" cy="42" r="26"/><text class="n" x="83" y="50">1</text><text class="h" x="20" y="92">Sand mould</text><text class="body" x="20" y="120">weather-sensitive work</text></g><line class="arrow" x1="235" y1="190" x2="265" y2="190"/><g transform="translate(275 115)"><rect class="card" width="180" height="150" rx="8"/><circle class="circle" cx="90" cy="42" r="26"/><text class="n" x="83" y="50">2</text><text class="h" x="20" y="92">Cupola pour</text><text class="body" x="20" y="120">koshiki furnace</text></g><line class="arrow" x1="455" y1="190" x2="485" y2="190"/><g transform="translate(495 115)"><rect class="card" width="180" height="150" rx="8"/><circle class="circle" cx="90" cy="42" r="26"/><text class="n" x="83" y="50">3</text><text class="h" x="20" y="92">Grind</text><text class="body" x="20" y="120">sand and seams removed</text></g><line class="arrow" x1="675" y1="190" x2="705" y2="190"/><g transform="translate(715 115)"><rect class="card" width="180" height="150" rx="8"/><circle class="circle" cx="90" cy="42" r="26"/><text class="n" x="83" y="50">4</text><text class="h" x="20" y="92">Kama-yaki</text><text class="body" x="20" y="120">≈900°C oxide layer</text></g><line class="arrow" x1="895" y1="190" x2="925" y2="190"/><g transform="translate(935 115)"><rect class="card" width="210" height="150" rx="8"/><circle class="circle" cx="105" cy="42" r="26"/><text class="n" x="98" y="50">5</text><text class="h" x="20" y="92">Color + fittings</text><text class="body" x="20" y="120">body, lid, handle finished</text></g><rect class="warn" x="55" y="340" width="1090" height="172" rx="8"/><text class="h" x="82" y="380" style="fill:#7b2f26">Coverage limit</text><text class="body" x="82" y="417">The workshop says moulding through dispatch is integrated for its production.</text><text class="body" x="82" y="451">Its current shop also credits some yakigata kettles to Shōkadō and other workshops.</text><text class="body" x="82" y="485">Therefore the seller name, workshop name and named object maker must be recorded separately.</text><text class="body" x="55" y="570">Source-grounded sequence; no process photograph was copied or traced.</text></svg>
