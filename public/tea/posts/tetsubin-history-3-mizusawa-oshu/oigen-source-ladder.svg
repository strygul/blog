<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Oigen evidence ladder</title><desc id="desc">Oigen evidence is ranked from company chronology and mark guide through model pages and regional sources to retailer listings, with the missing museum or archive whole-object pairs shown separately.</desc><style>.bg{fill:#f4efe5}.head{font:700 31px Georgia,serif;fill:#231f1b}.h{font:700 19px Arial,sans-serif;fill:#fff}.body{font:16px Arial,sans-serif;fill:#28231f}.small{font:15px Arial,sans-serif;fill:#62594f}.missing{fill:#fff3d9;stroke:#d3a03c;stroke-width:2;stroke-dasharray:9 7}</style><rect class="bg" width="1200" height="520"/><text class="head" x="55" y="57">Oigen evidence ladder</text><rect x="80" y="110" width="690" height="64" rx="7" fill="#315d64"/><text class="h" x="105" y="150">1 · Official chronology and official mark history</text><rect x="140" y="192" width="630" height="64" rx="7" fill="#55787d"/><text class="h" x="165" y="232">2 · Official model pages with SKU and craft route</text><rect x="200" y="274" width="570" height="64" rx="7" fill="#7a9396"/><text class="h" x="225" y="314">3 · Government, museum, association context</text><rect x="260" y="356" width="510" height="64" rx="7" fill="#a1afb0"/><text class="h" x="285" y="396">4 · Retail listings: discovery only</text><rect class="missing" x="835" y="110" width="310" height="310" rx="8"/><text x="865" y="155" style="font:700 21px Arial,sans-serif;fill:#7b2f26">Still missing</text><text class="body" x="865" y="198">• museum-published object pairs</text><text class="body" x="865" y="236">• dated mark-to-model sequence</text><text class="body" x="865" y="274">• historical production records</text><text class="body" x="865" y="312">• original fitting verification</text><text class="small" x="865" y="365">The official mark guide is strong</text><text class="small" x="865" y="388">for devices, not for an isolated kettle.</text></svg>
