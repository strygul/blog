<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Oigen mark history and evidence ceiling</title><desc id="desc">The official mark article documents the Nambu Seieido house mark, an early Oigen Latin logo, and the current 2015 Oigen logo as cast-in devices, but supplies no verified complete-kettle and mark pairs.</desc><style>.bg{fill:#f4efe5}.head{font:700 31px Georgia,serif;fill:#231f1b}.mark{font:700 28px 'Noto Sans JP',Arial,sans-serif;fill:#28231f}.date{font:700 18px Arial,sans-serif;fill:#7b2f26}.body{font:16px Arial,sans-serif;fill:#28231f}.small{font:15px Arial,sans-serif;fill:#62594f}.card{fill:#fff;stroke:#c9bba7;stroke-width:2}.warn{fill:#fff3d9;stroke:#d3a03c;stroke-width:2}</style><rect class="bg" width="1200" height="640"/><text class="head" x="55" y="57">Oigen marks: first-party devices, incomplete object context</text><g transform="translate(55 105)"><rect class="card" width="330" height="220" rx="8"/><text class="mark" x="25" y="58">南部盛榮堂</text><text class="date" x="25" y="95">historic house identity</text><text class="body" x="25" y="130">retained for traditional tea ware</text><text class="small" x="25" y="164">cast into product; exact model</text><text class="small" x="25" y="187">and full date range not supplied</text></g><g transform="translate(435 105)"><rect class="card" width="330" height="220" rx="8"/><text class="mark" x="25" y="58">OIGEN</text><text class="date" x="25" y="95">early 2000s–2015</text><text class="body" x="25" y="130">older Latin device</text><text class="small" x="25" y="164">still intentionally on Tenka;</text><text class="small" x="25" y="187">replacement ongoing elsewhere</text></g><g transform="translate(815 105)"><rect class="card" width="330" height="220" rx="8"/><text class="mark" x="25" y="58">OIGEN</text><text class="date" x="25" y="95">2015–present</text><text class="body" x="25" y="130">current identity system</text><text class="small" x="25" y="164">full or simplified device,</text><text class="small" x="25" y="187">depending on product</text></g><rect class="warn" x="55" y="365" width="1090" height="165" rx="8"/><text class="date" x="82" y="403">Evidence ceiling</text><text class="body" x="82" y="440">Three official device families; location described generally as reverse/underside/bottom.</text><text class="body" x="82" y="474">Zero verified complete-kettle/mark pairs; individual date ranges and model mapping remain incomplete.</text><text class="body" x="82" y="508">Official product notice says genuine Oigen pieces may be unmarked.</text><text class="small" x="55" y="581">Typeset names summarize the guide; they are not reproductions of logo shapes.</text></svg>
