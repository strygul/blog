<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Oigen and Oitomi mark evidence</title><desc id="desc">A comparison of documented Oigen cast-in marks and Oitomi's current trivet mark evidence, with separate kettle location, dates, complete-object pairs and confidence.</desc>
  <style>.bg{fill:#f4efe5}.head{font:700 32px Georgia,serif;fill:#231f1b}.sub{font:17px Arial,sans-serif;fill:#62594f}.h{font:700 25px Arial,sans-serif;fill:#fff}.k{font:700 18px Arial,sans-serif;fill:#7b2f26}.v{font:17px Arial,sans-serif;fill:#28231f}.big{font:700 31px 'Noto Sans JP',Arial,sans-serif;fill:#28231f}.card{fill:#fff;stroke:#c9bba7;stroke-width:2}.warn{fill:#fff3d9;stroke:#d3a03c;stroke-width:2}</style>
  <rect class="bg" width="1200" height="720"/><text class="head" x="55" y="58">Mark evidence: known labels are not automatic attribution</text><text class="sub" x="55" y="88">Typeset readings only; no source photograph or mark facsimile was traced.</text>
  <rect x="55" y="120" width="530" height="50" rx="7" fill="#9b4f3f"/><text class="h" x="82" y="153">Oigen / 及源鋳造</text>
  <rect class="card" x="55" y="182" width="530" height="380" rx="8"/><text class="big" x="84" y="229">南部盛榮堂 · OIGEN</text><text class="k" x="84" y="270">Technique</text><text class="v" x="230" y="270">cast into the product (official guide)</text><text class="k" x="84" y="309">Location</text><text class="v" x="230" y="309">back / underside / bottom; model-specific unknown</text><text class="k" x="84" y="348">Range</text><text class="v" x="230" y="348">old house name; early-2000s logo; 2015 logo</text><text class="k" x="84" y="387">Whole pairs</text><text class="v" x="230" y="387">0 verified complete-kettle + mark pairs</text><text class="k" x="84" y="426">Source</text><text class="v" x="230" y="426">first-party mark history and product notices</text><text class="k" x="84" y="465">Confidence</text><text class="v" x="230" y="465">documented devices; isolated object uncertain</text><text class="sub" x="84" y="513">Official warning: some Oigen products are unmarked.</text>
  <rect x="615" y="120" width="530" height="50" rx="7" fill="#315d64"/><text class="h" x="642" y="153">Oitomi / 及富</text>
  <rect class="card" x="615" y="182" width="530" height="380" rx="8"/><text class="big" x="644" y="229">及富 = Oitomi (workshop name)</text><text class="k" x="644" y="270">Technique</text><text class="v" x="790" y="270">“stamp” on trivet; method unknown</text><text class="k" x="644" y="309">Location</text><text class="v" x="790" y="309">trivet reverse; kettle location unknown</text><text class="k" x="644" y="348">Range</text><text class="v" x="790" y="348">trivet period unspecified; kettle range unknown</text><text class="k" x="644" y="387">Whole pairs</text><text class="v" x="790" y="387">1 trivet pair; 0 complete-kettle + mark pairs</text><text class="k" x="644" y="426">Source</text><text class="v" x="790" y="426">first-party trivet page; no kettle mark guide</text><text class="k" x="644" y="465">Confidence</text><text class="v" x="790" y="465">trivet documented; kettle attribution uncertain</text><text class="sub" x="644" y="513">Seller and maker fields may identify different workshops.</text>
  <rect class="warn" x="55" y="592" width="1090" height="88" rx="8"/><text class="k" x="80" y="624">Warning</text><text class="v" x="170" y="624">Start with the complete kettle. Lids, handles, boxes and certificates may be replacements or later pairings.</text><text class="v" x="80" y="653">Marks can be copied; workshops also made unmarked work; regional style alone cannot prove a maker or origin.</text>
</svg>
