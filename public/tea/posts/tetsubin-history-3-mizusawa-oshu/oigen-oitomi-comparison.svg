<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">A simple comparison of Oigen and Oitomi</title>
  <desc id="desc">Oigen is a large integrated manufacturer with several production routes and published current marks. Oitomi combines a family workshop with retailing, including work by named outside makers, and does not publish a complete kettle-mark guide.</desc>
  <rect width="1200" height="640" fill="#f7f3ea"/>
  <text x="600" y="65" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#26231f">Two ways of carrying Mizusawa forward</text>
  <rect x="70" y="120" width="500" height="450" rx="20" fill="#fff" stroke="#6b6257" stroke-width="3"/>
  <rect x="630" y="120" width="500" height="450" rx="20" fill="#fff" stroke="#6b6257" stroke-width="3"/>
  <text x="320" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#9b512d">Oigen</text>
  <text x="880" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#9b512d">Oitomi</text>
  <text x="320" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#403a33">Large integrated manufacturer</text>
  <text x="320" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#403a33">Several production routes</text>
  <text x="320" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#403a33">Publishes current marks</text>
  <text x="880" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#403a33">Family workshop and retailer</text>
  <text x="880" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#403a33">In-house work plus kettles</text>
  <text x="880" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#403a33">by named outside makers</text>
  <text x="880" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#403a33">No complete kettle-mark guide</text>
</svg>
