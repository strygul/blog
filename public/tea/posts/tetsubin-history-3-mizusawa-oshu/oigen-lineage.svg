<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Oigen chronology</title><desc id="desc">Oigen's workshop-reported 1852 foundation convention, 1947 incorporation, postwar return to daily goods, 1960s and 1970s modernization, and 2015 Oigen identity.</desc><style>.bg{fill:#f4efe5}.head{font:700 31px Georgia,serif;fill:#231f1b}.sub{font:16px Arial,sans-serif;fill:#62594f}.date{font:700 19px Arial,sans-serif;fill:#7b2f26}.body{font:16px Arial,sans-serif;fill:#28231f}.line{stroke:#9b4f3f;stroke-width:6}.dot{fill:#9b4f3f}.card{fill:#fff;stroke:#c9bba7;stroke-width:2}</style><rect class="bg" width="1200" height="420"/><text class="head" x="55" y="55">Oigen: the documented company sequence</text><text class="sub" x="55" y="82">Company chronology; “1852” is explicitly a convention based on the founder’s birth because a precise record is absent.</text><line class="line" x1="90" y1="190" x2="1110" y2="190"/><g><circle class="dot" cx="125" cy="190" r="12"/><rect class="card" x="55" y="220" width="205" height="112" rx="7"/><text class="date" x="75" y="249">1852</text><text class="body" x="75" y="277">foundation convention</text><text class="body" x="75" y="301">Oikawa Genjūrō</text></g><g><circle class="dot" cx="355" cy="190" r="12"/><rect class="card" x="285" y="95" width="205" height="70" rx="7"/><text class="date" x="305" y="124">1947</text><text class="body" x="305" y="148">company incorporated</text></g><g><circle class="dot" cx="585" cy="190" r="12"/><rect class="card" x="515" y="220" width="205" height="112" rx="7"/><text class="date" x="535" y="249">postwar</text><text class="body" x="535" y="277">return to household</text><text class="body" x="535" y="301">goods; mould shift</text></g><g><circle class="dot" cx="815" cy="190" r="12"/><rect class="card" x="745" y="95" width="205" height="70" rx="7"/><text class="date" x="765" y="124">1960s–70s</text><text class="body" x="765" y="148">factory modernization</text></g><g><circle class="dot" cx="1060" cy="190" r="12"/><rect class="card" x="975" y="220" width="170" height="112" rx="7"/><text class="date" x="995" y="249">2015</text><text class="body" x="995" y="277">OIGEN identity</text><text class="body" x="995" y="301">formally refreshed</text></g></svg>
