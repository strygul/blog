<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Oigen production routes</title><desc id="desc">Oigen's chronology records fired mould and green-sand production, while current kettle pages identify product-specific fired-mould craft. The exact route must be checked model by model.</desc><style>.bg{fill:#f4efe5}.head{font:700 31px Georgia,serif;fill:#231f1b}.h{font:700 23px Arial,sans-serif;fill:#fff}.body{font:17px Arial,sans-serif;fill:#28231f}.small{font:15px Arial,sans-serif;fill:#62594f}.card{fill:#fff;stroke:#c9bba7;stroke-width:2}.arrow{stroke:#887968;stroke-width:4;marker-end:url(#a)}.unknown{fill:#fff3d9;stroke:#d3a03c;stroke-width:2;stroke-dasharray:9 7}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#887968"/></marker></defs><rect class="bg" width="1200" height="640"/><text class="head" x="55" y="56">Oigen: one company, multiple documented production contexts</text><rect x="55" y="95" width="510" height="48" rx="7" fill="#9b4f3f"/><text class="h" x="82" y="127">Company-scale casting</text><rect class="card" x="55" y="160" width="220" height="94" rx="7"/><text class="body" x="76" y="193">design + moulding</text><text class="small" x="76" y="220">fired and green-sand history</text><rect class="card" x="345" y="160" width="220" height="94" rx="7"/><text class="body" x="366" y="193">casting + finishing</text><text class="small" x="366" y="220">several craftspeople</text><line class="arrow" x1="275" y1="207" x2="337" y2="207"/><rect x="635" y="95" width="510" height="48" rx="7" fill="#315d64"/><text class="h" x="662" y="127">Named fired-mould kettles</text><rect class="card" x="635" y="160" width="220" height="94" rx="7"/><text class="body" x="656" y="193">yakigata mould</text><text class="small" x="656" y="220">80+ operations reported</text><rect class="card" x="925" y="160" width="220" height="94" rx="7"/><text class="body" x="946" y="193">individual credit</text><text class="small" x="946" y="220">on specific product page</text><line class="arrow" x1="855" y1="207" x2="917" y2="207"/><rect class="unknown" x="55" y="310" width="1090" height="190" rx="8"/><text class="h" x="82" y="350" style="fill:#7b2f26">Do not infer the route from the logo</text><text class="body" x="82" y="389">• Oigen’s history records a postwar transition toward green-sand moulding.</text><text class="body" x="82" y="423">• Current pages separately document fired-mould kettles by named craftspeople.</text><text class="body" x="82" y="457">• A mark does not disclose mould type, role division, interior finish, or date.</text><text class="small" x="55" y="557">Evidence needed for an object: model/SKU + dated catalogue or receipt + whole object + its mark + interior and base.</text></svg>
