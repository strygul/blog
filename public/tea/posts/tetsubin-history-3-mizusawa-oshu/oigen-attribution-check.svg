<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Oigen attribution check</title><desc id="desc">A five-step check moves from complete object and function to model record, mark, fittings, and provenance, ending in a bounded attribution.</desc><style>.bg{fill:#f4efe5}.head{font:700 31px Georgia,serif;fill:#231f1b}.num{font:700 26px Arial,sans-serif;fill:#fff}.h{font:700 18px Arial,sans-serif;fill:#7b2f26}.body{font:15px Arial,sans-serif;fill:#28231f}.card{fill:#fff;stroke:#c9bba7;stroke-width:2}.n{fill:#9b4f3f}.arrow{stroke:#887968;stroke-width:4;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#887968"/></marker></defs><rect class="bg" width="1200" height="600"/><text class="head" x="55" y="58">Attributing an Oigen object: the shortest defensible path</text><g transform="translate(55 115)"><rect class="card" width="190" height="220" rx="8"/><circle class="n" cx="95" cy="48" r="28"/><text class="num" x="87" y="57">1</text><text class="h" x="24" y="100">Whole object</text><text class="body" x="24" y="132">body, base, spout, lid,</text><text class="body" x="24" y="156">handle, interior</text></g><line class="arrow" x1="245" y1="225" x2="275" y2="225"/><g transform="translate(285 115)"><rect class="card" width="190" height="220" rx="8"/><circle class="n" cx="95" cy="48" r="28"/><text class="num" x="87" y="57">2</text><text class="h" x="24" y="100">Function + model</text><text class="body" x="24" y="132">boiler or teapot?</text><text class="body" x="24" y="156">SKU/catalogue match?</text></g><line class="arrow" x1="475" y1="225" x2="505" y2="225"/><g transform="translate(515 115)"><rect class="card" width="190" height="220" rx="8"/><circle class="n" cx="95" cy="48" r="28"/><text class="num" x="87" y="57">3</text><text class="h" x="24" y="100">Mark</text><text class="body" x="24" y="132">device, technique,</text><text class="body" x="24" y="156">location, date window</text></g><line class="arrow" x1="705" y1="225" x2="735" y2="225"/><g transform="translate(745 115)"><rect class="card" width="190" height="220" rx="8"/><circle class="n" cx="95" cy="48" r="28"/><text class="num" x="87" y="57">4</text><text class="h" x="24" y="100">Fittings</text><text class="body" x="24" y="132">original pairing</text><text class="body" x="24" y="156">still unproved</text></g><line class="arrow" x1="935" y1="225" x2="965" y2="225"/><g transform="translate(975 115)"><rect class="card" width="170" height="220" rx="8"/><circle class="n" cx="85" cy="48" r="28"/><text class="num" x="77" y="57">5</text><text class="h" x="20" y="100">Provenance</text><text class="body" x="20" y="132">receipt, box, archive,</text><text class="body" x="20" y="156">workshop response</text></g><rect x="55" y="390" width="1090" height="110" rx="8" fill="#315d64"/><text x="82" y="430" style="font:700 20px Arial,sans-serif;fill:#fff">Conclusion language</text><text x="82" y="467" style="font:17px Arial,sans-serif;fill:#fff">Documented model + paired mark + provenance → strong. Mark alone → Oigen-type device, date and complete-object attribution uncertain.</text></svg>
