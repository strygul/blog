<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Oigen product evidence</title><desc id="desc">Three official product contexts show a small Maromi arare kettle, a traditional fired-mould dragon relief kettle, and broader daily cookware. These categories prevent one form from standing for the whole company.</desc><style>.bg{fill:#f4efe5}.head{font:700 31px Georgia,serif;fill:#231f1b}.h{font:700 22px Arial,sans-serif;fill:#7b2f26}.body{font:17px Arial,sans-serif;fill:#28231f}.small{font:15px Arial,sans-serif;fill:#62594f}.card{fill:#fff;stroke:#c9bba7;stroke-width:2}.iron{fill:#3c3b39;stroke:#171615;stroke-width:5}.handle{fill:none;stroke:#292826;stroke-width:14}</style><rect class="bg" width="1200" height="600"/><text class="head" x="55" y="58">Oigen: compare product records, not a single “house style”</text><g transform="translate(55 105)"><rect class="card" width="330" height="390" rx="8"/><path class="handle" d="M78 155 Q165 35 252 155"/><ellipse class="iron" cx="165" cy="207" rx="105" ry="76"/><path class="iron" d="M257 190 q54 5 48 43 q-28-3-53 11z"/><text class="h" x="25" y="315">Maromi arare, 1 L</text><text class="body" x="25" y="345">current compact boiler</text><text class="small" x="25" y="372">movable handle; current Oigen form</text></g><g transform="translate(435 105)"><rect class="card" width="330" height="390" rx="8"/><path class="handle" d="M72 162 Q165 28 258 162"/><ellipse class="iron" cx="165" cy="209" rx="107" ry="82"/><path class="iron" d="M258 190 q55 3 48 43 q-27 1-55 14z"/><path d="M105 210 q45-55 90 0 q-45 45-90 0" fill="none" stroke="#bd9b63" stroke-width="6"/><text class="h" x="25" y="315">Dragon form, 1.7 L</text><text class="body" x="25" y="345">named fired-mould kettle</text><text class="small" x="25" y="372">relief + fixed fitted handle</text></g><g transform="translate(815 105)"><rect class="card" width="330" height="390" rx="8"/><ellipse class="iron" cx="165" cy="221" rx="120" ry="45"/><rect class="iron" x="151" y="112" width="28" height="110" rx="12"/><text class="h" x="25" y="315">Daily cooking vessels</text><text class="body" x="25" y="345">pots, pans, rice cookers</text><text class="small" x="25" y="372">the utilitarian Mizusawa line persists</text></g><text class="small" x="55" y="555">Schematic silhouettes, not traced products. Sources: Oigen product pages and corporate chronology.</text></svg>
