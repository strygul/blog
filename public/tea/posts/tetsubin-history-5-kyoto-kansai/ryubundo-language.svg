<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img"><rect width="1200" height="420" fill="#f4efe6"/><g font-family="Georgia,serif" fill="#24211d"><text x="50" y="60" font-size="34">Ryūbundō visual vocabulary: comparison, not a fingerprint</text><g font-size="25"><text x="90" y="145">rough casting skin</text><text x="90" y="195">burnished field</text><text x="90" y="245">grapevine relief / inlay</text><text x="90" y="295">bronze lid and wrought handle</text></g><text x="650" y="190" font-size="28">Each feature can occur elsewhere.</text><text x="650" y="245" font-size="22">Style alone cannot authenticate maker, region, date, or original assembly.</text></g></svg>
