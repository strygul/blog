<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img"><rect width="1200" height="420" fill="#f4efe6"/><g font-family="Georgia,serif" fill="#24211d"><text x="50" y="60" font-size="34">Representative Ryūbundō object: Princeton 2019-302 a–b</text><g font-size="25"><text x="70" y="145">Large kettle with crescent handle</text><text x="70" y="195">late 19th–early 20th century · iron</text><text x="70" y="245">44 × 31.5 × 26 cm · gift of Richard and Ruth Dickes</text><text x="70" y="295">provenance: Dickes family to Princeton, 2019</text></g><text x="70" y="360" font-size="21">Inscription is on the lid bottom: “Ryūbundō zō” (龍文堂造), so the museum’s complete object record matters.</text></g></svg>
