<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img"><rect width="1200" height="420" fill="#f4efe6"/><g font-family="Georgia,serif" fill="#24211d"><text x="50" y="60" font-size="34">Ryūbundō attribution check</text><g font-size="22"><text x="70" y="145">1 complete body and interior</text><text x="70" y="195">2 lid and handle separately recorded</text><text x="70" y="245">3 inscription: exact location / technique</text><text x="70" y="295">4 construction, surface, provenance checked together</text></g><text x="70" y="350" font-size="18">British Museum warning: signed copper lid may be fitted to another body.</text></g></svg>
