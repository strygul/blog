<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img"><rect width="1200" height="420" fill="#f4efe6"/><g font-family="Georgia,serif" fill="#24211d"><text x="50" y="60" font-size="34">Ryūbundō: documented object construction, not a universal recipe</text><g font-size="25"><text x="70" y="150">cast-iron body</text><text x="330" y="150">wrought crescent handle</text><text x="650" y="150">bronze / copper lid</text><text x="910" y="150">separate fittings</text></g><path d="M120 205H1040" stroke="#a05a35" stroke-width="4"/><text x="70" y="275" font-size="19">Relief, burnishing, engraving, and gold/silver inlay occur on catalogued comparisons.</text><text x="70" y="325" font-size="19">Lost-wax casting is not established for every Ryūbundō body.</text><text x="70" y="360" font-size="19">Do not infer route from rich decoration.</text></g></svg>
