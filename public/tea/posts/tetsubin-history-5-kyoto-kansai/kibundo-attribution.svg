<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img"><rect width="1200" height="420" fill="#f4efe6"/><g font-family="Georgia,serif" fill="#24211d"><text x="50" y="60" font-size="34">Kibundō attribution: Ōmi is not a stamp of certainty</text><g font-size="24"><text x="70" y="145">location claim → source / date</text><text x="70" y="195">body mark → exact characters / method / position</text><text x="70" y="245">fittings → original relationship independently tested</text><text x="70" y="295">style → comparison only</text></g><text x="70" y="360" font-size="21">Without a documented whole-object pair, confidence remains uncertain.</text></g></svg>
