<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Suzuki Morihisa mark-location and evidence diagram</title><desc id="desc">The documented Morihisa characters, verified low location near the spout, two published historical variants, zero verified complete-kettle pairs, confidence limits, and evidence needed.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a83c2e"/></marker></defs>
  <style>.bg{fill:#f7f1eb}.ink{fill:#271c18}.muted{fill:#6d5a51}.accent{fill:#a83c2e}.box{fill:#fff;stroke:#d9c8bd;stroke-width:2}.warn{fill:#fff4e5;stroke:#a83c2e;stroke-width:3}.title{font:700 38px system-ui,sans-serif}.head{font:700 21px system-ui,sans-serif}.body{font:20px system-ui,sans-serif}.mark{font:700 64px serif}.count{font:700 54px system-ui,sans-serif}.small{font:18px system-ui,sans-serif}</style>
  <rect class="bg" width="1200" height="640" rx="28"/><text x="58" y="70" class="title ink">Suzuki Morihisa · mark evidence map</text><text x="58" y="105" class="body muted">Solid pointer = location documented by Horie; kettle outline is schematic.</text>
  <g transform="translate(55 145)"><rect width="440" height="405" rx="20" class="box"/><path d="M105 270Q105 160 225 150Q345 160 345 270Z" fill="#e5d8cf" stroke="#271c18" stroke-width="5"/><path d="M150 152Q225 55 300 152" fill="none" stroke="#271c18" stroke-width="10"/><path d="M344 200Q410 185 414 225Q386 244 345 244" fill="#e5d8cf" stroke="#271c18" stroke-width="5"/><circle cx="327" cy="258" r="11" class="accent"/><path d="M327 258L230 330" fill="none" stroke="#a83c2e" stroke-width="4" marker-end="url(#arrow)"/><text x="28" y="355" class="head accent">VERIFIED LOCATION</text><text x="28" y="386" class="body ink">Low near spout, kettle inverted</text></g>
  <g transform="translate(530 145)"><rect width="615" height="125" rx="20" class="box"/><text x="28" y="34" class="head muted">DOCUMENTED CHARACTERS / READING</text><text x="28" y="108" class="mark accent">盛久</text><text x="164" y="82" class="head ink"><tspan x="164">Morihisa · two published</tspan><tspan x="164" dy="26">historical variants</tspan></text></g>
  <g transform="translate(530 290)"><rect width="285" height="125" rx="20" class="box"/><text x="25" y="38" class="small muted">VERIFIED COMPLETE OBJECTS</text><text x="25" y="101" class="count accent">0</text><text x="82" y="94" class="body ink">mark pairs</text></g>
  <g transform="translate(835 290)"><rect width="310" height="125" rx="20" class="warn"/><text x="25" y="38" class="head accent">CONFIDENCE</text><text x="25" y="75" class="body ink">Variants documented;</text><text x="25" y="102" class="body ink">isolated attribution uncertain.</text></g>
  <g transform="translate(530 435)"><rect width="615" height="115" rx="20" class="box"/><text x="25" y="38" class="head ink">EVIDENCE NEEDED</text><text x="25" y="72" class="body ink">Whole kettle + mark in one technical or museum record;</text><text x="25" y="99" class="body ink">dated seal sequence and object-linked provenance.</text></g>
  <text x="600" y="605" text-anchor="middle" class="small muted">Mark alone is not authentication.</text>
</svg>
