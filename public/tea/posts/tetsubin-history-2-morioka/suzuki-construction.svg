<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Suzuki Morihisa documented workshop and construction evidence</title>
  <desc id="desc">A schematic chain of design supervision, collaborative breakable-mould work, casting release, and finishing, with undocumented role divisions and historical continuity marked unknown.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a83c2e"/></marker></defs>
  <style>.bg{fill:#fbf7f3}.ink{fill:#271c18}.muted{fill:#6d5a51}.accent{fill:#a83c2e}.box{fill:#fff;stroke:#d9c8bd;stroke-width:2}.unknown{fill:#fff4e5;stroke:#a83c2e;stroke-width:3;stroke-dasharray:10 8}.flow{stroke:#a83c2e;stroke-width:4;fill:none;marker-end:url(#arrow)}.title{font:700 38px system-ui,sans-serif}.head{font:700 21px system-ui,sans-serif}.body{font:20px system-ui,sans-serif}.small{font:18px system-ui,sans-serif}</style>
  <rect class="bg" width="1200" height="640" rx="28"/><text x="58" y="70" class="title ink">Suzuki Morihisa · what construction records support</text><text x="58" y="106" class="body muted">Documented workflow is shown as solid; unanswered attribution questions are dashed.</text>
  <g transform="translate(55 170)"><rect width="240" height="160" rx="18" class="box"/><circle cx="42" cy="43" r="21" class="accent"/><text x="78" y="36" class="head ink"><tspan x="78">Design +</tspan><tspan x="78" dy="24">supervision</tspan></text><text x="24" y="94" class="body ink">Hereditary head</text><text x="24" y="122" class="body ink">directs the workshop.</text><text x="24" y="148" class="small muted">Workshop account</text></g>
  <path d="M300 250H350" class="flow"/>
  <g transform="translate(360 170)"><rect width="240" height="160" rx="18" class="box"/><path d="M42 122Q42 50 120 45Q198 50 198 122" fill="none" stroke="#a83c2e" stroke-width="7"/><text x="120" y="145" text-anchor="middle" class="small accent">BREAKABLE MOULD</text><text x="120" y="30" text-anchor="middle" class="head ink">Mould stages</text></g>
  <path d="M605 250H655" class="flow"/>
  <g transform="translate(665 170)"><rect width="240" height="160" rx="18" class="box"/><path d="M68 121Q68 68 120 63Q172 68 172 121Z" fill="#d9c8bd" stroke="#271c18" stroke-width="4"/><path d="M92 64Q120 28 148 64" fill="none" stroke="#271c18" stroke-width="7"/><text x="120" y="30" text-anchor="middle" class="head ink">Cast + release</text><text x="120" y="148" text-anchor="middle" class="small muted">Mould is destroyed</text></g>
  <path d="M910 250H960" class="flow"/>
  <g transform="translate(970 170)"><rect width="175" height="160" rx="18" class="box"/><text x="88" y="45" text-anchor="middle" class="head ink">Finish + fit</text><text x="88" y="83" text-anchor="middle" class="body ink">Hand finish</text><text x="88" y="111" text-anchor="middle" class="body ink">Handle + lid</text><text x="88" y="143" text-anchor="middle" class="small muted">Current tendency</text></g>
  <g transform="translate(170 410)"><rect width="860" height="142" rx="18" class="unknown"/><text x="35" y="42" class="head accent">UNKNOWN — do not infer from appearance</text><text x="35" y="78" class="body ink">Role split by model · whether older objects used today’s workflow</text><text x="35" y="108" class="body ink">Replacement fittings · production record for an isolated kettle</text></g>
  <text x="600" y="605" text-anchor="middle" class="small muted">Original schematic; no maker photograph or proprietary design traced.</text>
</svg>
