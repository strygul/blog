<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of four Morioka ironware workshops</title>
  <desc id="desc">Four-column comparison of Suzuki Morihisa, Kunzan, Iwachu, and Kamasada by lineage, work organization, surface language, lid and handle tendencies, and documented current status.</desc>
  <rect width="1200" height="900" fill="#f5f0e7"/>
  <style>
    text { font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; fill: #211d19; }
    .title { font-family: Georgia, "Noto Serif JP", serif; font-size: 34px; font-weight: 700; }
    .sub { font-size: 16px; fill: #665d53; }
    .maker { font-size: 21px; font-weight: 700; }
    .row { font-size: 14px; font-weight: 700; letter-spacing: .06em; fill: #765a3d; }
    .body { font-size: 14px; }
    .rule { stroke: #c9b9a7; stroke-width: 1; }
    .iron { fill: #292b2d; stroke: #171819; stroke-width: 3; }
    .handle { fill: none; stroke: #292b2d; stroke-width: 11; stroke-linecap: round; }
  </style>

  <text x="52" y="58" class="title">Four workshops inside one regional name</text>
  <text x="52" y="88" class="sub">Representative tendencies, not authentication rules or quality rankings</text>

  <g transform="translate(195 112)">
    <path class="handle" d="M26 99 C30 9 158 8 163 99"/>
    <path class="iron" d="M20 103 Q93 73 169 103 L178 176 Q93 210 10 176 Z"/>
    <path class="iron" d="M168 119 Q207 108 217 86 Q224 121 178 144 Z"/>
    <ellipse class="iron" cx="94" cy="101" rx="38" ry="11"/>
    <circle cx="94" cy="82" r="9" fill="#292b2d"/>
  </g>
  <g transform="translate(455 112)">
    <path class="handle" d="M28 102 C31 28 156 26 161 102"/>
    <path class="iron" d="M16 105 Q94 78 171 105 Q181 149 163 181 Q94 204 25 181 Q7 148 16 105 Z"/>
    <path class="iron" d="M168 120 Q205 111 220 91 Q222 123 176 146 Z"/>
    <ellipse class="iron" cx="94" cy="103" rx="40" ry="11"/>
    <circle cx="94" cy="84" r="9" fill="#292b2d"/>
  </g>
  <g transform="translate(715 112)">
    <path class="handle" d="M24 101 C28 19 160 19 164 101"/>
    <path class="iron" d="M10 107 Q95 70 178 107 L174 180 Q95 198 16 180 Z"/>
    <path class="iron" d="M172 120 Q211 106 222 85 Q229 120 178 145 Z"/>
    <ellipse class="iron" cx="95" cy="104" rx="43" ry="11"/>
    <rect x="88" y="78" width="14" height="16" rx="3" fill="#292b2d"/>
  </g>
  <g transform="translate(975 112)">
    <path class="handle" d="M29 103 C34 37 155 36 161 103"/>
    <path class="iron" d="M19 104 Q94 83 169 104 Q180 142 157 179 Q94 204 31 179 Q7 142 19 104 Z"/>
    <path class="iron" d="M164 119 Q201 112 216 92 Q220 122 173 145 Z"/>
    <ellipse class="iron" cx="94" cy="103" rx="34" ry="10"/>
    <circle cx="94" cy="85" r="8" fill="#292b2d"/>
  </g>

  <text x="285" y="345" text-anchor="middle" class="maker">Suzuki Morihisa</text>
  <text x="545" y="345" text-anchor="middle" class="maker">Kunzan</text>
  <text x="805" y="345" text-anchor="middle" class="maker">Iwachu</text>
  <text x="1065" y="345" text-anchor="middle" class="maker">Kamasada</text>

  <line x1="44" y1="371" x2="1156" y2="371" class="rule"/>
  <text x="52" y="405" class="row">LINEAGE</text>
  <text x="185" y="402" class="body"><tspan x="185">Official-caster family;</tspan><tspan x="185" dy="20">1625 / 1641 conflict</tspan></text>
  <text x="445" y="402" class="body"><tspan x="445">Founded 1937 after</tspan><tspan x="445" dy="20">Asada trained at Shuzendo</tspan></text>
  <text x="705" y="402" class="body"><tspan x="705">Early-20th-century</tspan><tspan x="705" dy="20">family workshop to company</tspan></text>
  <text x="965" y="402" class="body"><tspan x="965">Miya iron-kettle shop,</tspan><tspan x="965" dy="20">late Meiji (c. 1908)</tspan></text>

  <line x1="44" y1="452" x2="1156" y2="452" class="rule"/>
  <text x="52" y="486" class="row">MOULD / WORK</text>
  <text x="185" y="483" class="body"><tspan x="185">Burnt loam mould;</tspan><tspan x="185" dy="20">master and specialist team</tspan></text>
  <text x="445" y="483" class="body"><tspan x="445">Manual burnt mould;</tspan><tspan x="445" dy="20">casting retained in-house</tspan></text>
  <text x="705" y="483" class="body"><tspan x="705">Hand kettle line plus</tspan><tspan x="705" dy="20">integrated factory lines</tspan></text>
  <text x="965" y="483" class="body"><tspan x="965">About 80 operations;</tspan><tspan x="965" dy="20">one maker carries each piece</tspan></text>

  <line x1="44" y1="533" x2="1156" y2="533" class="rule"/>
  <text x="52" y="567" class="row">SURFACE</text>
  <text x="185" y="564" class="body"><tspan x="185">Arare, comb lines,</tspan><tspan x="185" dy="20">relief and fine sand skin</tspan></text>
  <text x="445" y="564" class="body"><tspan x="445">Hada, arare, itome,</tspan><tspan x="445" dy="20">kikkō and pictorial work</tspan></text>
  <text x="705" y="564" class="body"><tspan x="705">Arare and broad catalogue;</tspan><tspan x="705" dy="20">color belongs mainly to kyūsu</tspan></text>
  <text x="965" y="564" class="body"><tspan x="965">Restrained skin, arare,</tspan><tspan x="965" dy="20">geometric modern forms</tspan></text>

  <line x1="44" y1="614" x2="1156" y2="614" class="rule"/>
  <text x="52" y="648" class="row">LID / HANDLE</text>
  <text x="185" y="645" class="body"><tspan x="185">Iron lids; fixed forged</tspan><tspan x="185" dy="20">handles; varied knobs</tspan></text>
  <text x="445" y="645" class="body"><tspan x="445">Iron lids and fixed handles;</tspan><tspan x="445" dy="20">some wooden-knob designs</tspan></text>
  <text x="705" y="645" class="body"><tspan x="705">Traditional kettle fittings;</tspan><tspan x="705" dy="20">product category matters</tspan></text>
  <text x="965" y="645" class="body"><tspan x="965">Fixed iron handles;</tspan><tspan x="965" dy="20">plain or sculpted iron lids</tspan></text>

  <line x1="44" y1="695" x2="1156" y2="695" class="rule"/>
  <text x="52" y="729" class="row">CURRENT STATUS</text>
  <text x="200" y="726" class="body"><tspan x="200">16th Morihisa Shigeo</tspan><tspan x="200" dy="20">succeeded in 2023</tspan></text>
  <text x="445" y="726" class="body"><tspan x="445">Active at Morioka</tspan><tspan x="445" dy="20">Handi-Works Square</tspan></text>
  <text x="705" y="726" class="body"><tspan x="705">Active integrated maker;</tspan><tspan x="705" dy="20">Yayoi Iwashimizu, president</tspan></text>
  <text x="965" y="726" class="body"><tspan x="965">Active Konyachō studio;</tspan><tspan x="965" dy="20">Miya: 2024 Yellow Ribbon</tspan></text>

  <line x1="44" y1="776" x2="1156" y2="776" class="rule"/>
  <text x="52" y="815" class="sub">Silhouettes are schematic. Workshop, generation, product grade, and commission can cross these tendencies.</text>
  <text x="52" y="844" class="sub">Sources: workshop records, Morioka City, Nambu Ironware Cooperative Association, Iwate University, and current catalogues.</text>
</svg>
