<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Four Morioka workshops at a glance</title>
  <desc id="desc">A concise four-column summary of each workshop's lineage, working structure, and current status. Full details are provided in the adjacent HTML table.</desc>
  <rect width="1200" height="650" fill="#f5f0e7"/>
  <style>text{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;fill:#211d19}.title{font:700 38px Georgia,"Noto Serif JP",serif}.sub{font-size:22px;fill:#665d53}.maker{font-size:27px;font-weight:800}.label{font-size:18px;font-weight:800;letter-spacing:.05em;fill:#8a4b2a}.body{font-size:23px}.card{fill:#fffdf9;stroke:#c9b9a7;stroke-width:2}.band{fill:#2f3c43}.status{fill:#fff;font-size:23px;font-weight:700}</style>
  <text x="48" y="60" class="title">Four workshops inside one regional name</text>
  <text x="48" y="96" class="sub">Documented differences, not authentication rules or quality rankings</text>
  <g transform="translate(36 132)"><rect width="270" height="440" rx="10" class="card"/><text x="22" y="48" class="maker">Suzuki Morihisa</text><text x="22" y="94" class="label">LINEAGE</text><text x="22" y="130" class="body"><tspan x="22">1625 / 1641 conflict;</tspan><tspan x="22" dy="30">hereditary name</tspan></text><text x="22" y="214" class="label">WORK</text><text x="22" y="250" class="body"><tspan x="22">Master + team;</tspan><tspan x="22" dy="30">breakable mould</tspan></text><rect y="348" width="270" height="92" rx="0" class="band"/><text x="22" y="386" class="status"><tspan x="22">16th head active</tspan><tspan x="22" dy="30">since 2023</tspan></text></g>
  <g transform="translate(322 132)"><rect width="270" height="440" rx="10" class="card"/><text x="22" y="48" class="maker">Kunzan</text><text x="22" y="94" class="label">LINEAGE</text><text x="22" y="130" class="body"><tspan x="22">Founded 1937 after</tspan><tspan x="22" dy="30">Shuzendō training</tspan></text><text x="22" y="214" class="label">WORK</text><text x="22" y="250" class="body"><tspan x="22">Manual pattern;</tspan><tspan x="22" dy="30">casting in-house</tspan></text><rect y="348" width="270" height="92" class="band"/><text x="22" y="386" class="status"><tspan x="22">Active at</tspan><tspan x="22" dy="30">Handi-Works Square</tspan></text></g>
  <g transform="translate(608 132)"><rect width="270" height="440" rx="10" class="card"/><text x="22" y="48" class="maker">Iwachu</text><text x="22" y="94" class="label">LINEAGE</text><text x="22" y="130" class="body"><tspan x="22">Early 20th century;</tspan><tspan x="22" dy="30">three official dates</tspan></text><text x="22" y="214" class="label">WORK</text><text x="22" y="250" class="body"><tspan x="22">Traditional kettle +</tspan><tspan x="22" dy="30">integrated lines</tspan></text><rect y="348" width="270" height="92" class="band"/><text x="22" y="386" class="status"><tspan x="22">Active integrated</tspan><tspan x="22" dy="30">maker</tspan></text></g>
  <g transform="translate(894 132)"><rect width="270" height="440" rx="10" class="card"/><text x="22" y="48" class="maker">Kamasada</text><text x="22" y="94" class="label">LINEAGE</text><text x="22" y="130" class="body"><tspan x="22">Miya family;</tspan><tspan x="22" dy="30">late-Meiji shop</tspan></text><text x="22" y="214" class="label">WORK</text><text x="22" y="250" class="body"><tspan x="22">One maker carries</tspan><tspan x="22" dy="30">about 80 operations</tspan></text><rect y="348" width="270" height="92" class="band"/><text x="22" y="386" class="status"><tspan x="22">Active Konyachō</tspan><tspan x="22" dy="30">workshop</tspan></text></g>
  <text x="48" y="622" class="sub">Full comparison and evidence qualifications follow in accessible text.</text>
</svg>
