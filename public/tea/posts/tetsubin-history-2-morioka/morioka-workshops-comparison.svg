<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of four Morioka ironware workshops</title>
  <desc id="desc">Representative schematic silhouettes for Suzuki Morihisa, Kunzan, Iwachu, and Kamasada above five rows comparing documented lineage, mould and work organization, typical surface language, lid and handle tendency, and current status. These are not authentication rules.</desc>
  <rect width="1200" height="900" fill="#f5f0e7"/>
  <style>text{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;fill:#211d19}.title{font:700 36px Georgia,"Noto Serif JP",serif}.sub{font-size:17px;fill:#665d53}.maker{font-size:22px;font-weight:800}.row{font-size:14px;font-weight:800;letter-spacing:.05em;fill:#8a4b2a}.body{font-size:15px}.rule{stroke:#c9b9a7;stroke-width:1.5}.iron{fill:#292b2d;stroke:#171819;stroke-width:3}.handle{fill:none;stroke:#292b2d;stroke-width:11;stroke-linecap:round}</style>
  <text x="48" y="58" class="title">Four workshops inside one regional name</text>
  <text x="48" y="89" class="sub">Representative documented tendencies—not authentication rules or quality rankings</text>

  <g transform="translate(195 112)"><path class="handle" d="M26 99C30 9 158 8 163 99"/><path class="iron" d="M20 103Q93 73 169 103L178 176Q93 210 10 176Z"/><path class="iron" d="M168 119Q207 108 217 86Q224 121 178 144Z"/><ellipse class="iron" cx="94" cy="101" rx="38" ry="11"/><circle cx="94" cy="82" r="9" fill="#292b2d"/></g>
  <g transform="translate(455 112)"><path class="handle" d="M28 102C31 28 156 26 161 102"/><path class="iron" d="M16 105Q94 78 171 105Q181 149 163 181Q94 204 25 181Q7 148 16 105Z"/><path class="iron" d="M168 120Q205 111 220 91Q222 123 176 146Z"/><ellipse class="iron" cx="94" cy="103" rx="40" ry="11"/><circle cx="94" cy="84" r="9" fill="#292b2d"/></g>
  <g transform="translate(715 112)"><path class="handle" d="M24 101C28 19 160 19 164 101"/><path class="iron" d="M10 107Q95 70 178 107L174 180Q95 198 16 180Z"/><path class="iron" d="M172 120Q211 106 222 85Q229 120 178 145Z"/><ellipse class="iron" cx="95" cy="104" rx="43" ry="11"/><rect x="88" y="78" width="14" height="16" rx="3" fill="#292b2d"/></g>
  <g transform="translate(975 112)"><path class="handle" d="M29 103C34 37 155 36 161 103"/><path class="iron" d="M19 104Q94 83 169 104Q180 142 157 179Q94 204 31 179Q7 142 19 104Z"/><path class="iron" d="M164 119Q201 112 216 92Q220 122 173 145Z"/><ellipse class="iron" cx="94" cy="103" rx="34" ry="10"/><circle cx="94" cy="85" r="8" fill="#292b2d"/></g>

  <text x="285" y="345" text-anchor="middle" class="maker">Suzuki Morihisa</text><text x="545" y="345" text-anchor="middle" class="maker">Kunzan</text><text x="805" y="345" text-anchor="middle" class="maker">Iwachu</text><text x="1065" y="345" text-anchor="middle" class="maker">Kamasada</text>

  <line x1="44" y1="371" x2="1156" y2="371" class="rule"/><text x="52" y="405" class="row">LINEAGE</text>
  <text x="185" y="402" class="body"><tspan x="185">Official-caster family;</tspan><tspan x="185" dy="21">1625 / 1641 conflict</tspan></text><text x="445" y="402" class="body"><tspan x="445">Founded 1937 after</tspan><tspan x="445" dy="21">Shuzendō training</tspan></text><text x="705" y="402" class="body"><tspan x="705">1901 / 1902 / 1908;</tspan><tspan x="705" dy="21">foundry dates to 1950</tspan></text><text x="965" y="402" class="body"><tspan x="965">Miya family; late-Meiji</tspan><tspan x="965" dy="21">shop, exact year unstated</tspan></text>

  <line x1="44" y1="452" x2="1156" y2="452" class="rule"/><text x="52" y="486" class="row">MOULD / WORK</text>
  <text x="185" y="483" class="body"><tspan x="185">Breakable fired mould;</tspan><tspan x="185" dy="21">hereditary head + team</tspan></text><text x="445" y="483" class="body"><tspan x="445">Manual fired mould;</tspan><tspan x="445" dy="21">casting retained in-house</tspan></text><text x="705" y="483" class="body"><tspan x="705">Hand kettle line plus</tspan><tspan x="705" dy="21">integrated factory lines</tspan></text><text x="965" y="483" class="body"><tspan x="965">About 40 / 80 operations;</tspan><tspan x="965" dy="21">one maker carries a piece</tspan></text>

  <line x1="44" y1="533" x2="1156" y2="533" class="rule"/><text x="52" y="567" class="row">SURFACE</text>
  <text x="185" y="564" class="body"><tspan x="185">Arare, vertical ribs,</tspan><tspan x="185" dy="21">combed or restrained skin</tspan></text><text x="445" y="564" class="body"><tspan x="445">Hada, arare, itome,</tspan><tspan x="445" dy="21">kikkō and pictorial work</tspan></text><text x="705" y="564" class="body"><tspan x="705">Arare, ribbed, rough,</tspan><tspan x="705" dy="21">and pictorial catalogue</tspan></text><text x="965" y="564" class="body"><tspan x="965">Yuzu skin, arare,</tspan><tspan x="965" dy="21">restrained geometric forms</tspan></text>

  <line x1="44" y1="614" x2="1156" y2="614" class="rule"/><text x="52" y="648" class="row">LID / HANDLE</text>
  <text x="185" y="645" class="body"><tspan x="185">Iron lids; fixed forged</tspan><tspan x="185" dy="21">handles; varied knobs</tspan></text><text x="445" y="645" class="body"><tspan x="445">Iron lids and fixed handles;</tspan><tspan x="445" dy="21">some other-material knobs</tspan></text><text x="705" y="645" class="body"><tspan x="705">Traditional fixed fittings;</tspan><tspan x="705" dy="21">product category matters</tspan></text><text x="965" y="645" class="body"><tspan x="965">Broad fixed iron handles;</tspan><tspan x="965" dy="21">spare lids need caution</tspan></text>

  <line x1="44" y1="695" x2="1156" y2="695" class="rule"/><text x="52" y="729" class="row">CURRENT STATUS</text>
  <text x="195" y="726" class="body"><tspan x="195">16th Morihisa Shigeo</tspan><tspan x="195" dy="21">succeeded in 2023</tspan></text><text x="445" y="726" class="body"><tspan x="445">Active at Morioka</tspan><tspan x="445" dy="21">Handi-Works Square</tspan></text><text x="705" y="726" class="body"><tspan x="705">Active integrated maker;</tspan><tspan x="705" dy="21">Yayoi Iwashimizu, president</tspan></text><text x="965" y="726" class="body"><tspan x="965">Active Konyachō workshop;</tspan><tspan x="965" dy="21">Miya: 2024 Yellow Ribbon</tspan></text>

  <line x1="44" y1="776" x2="1156" y2="776" class="rule"/><text x="48" y="815" class="sub">Silhouettes are schematic. Workshop, generation, product grade, and commission can cross these tendencies.</text><text x="48" y="844" class="sub">Evidence: workshop records, Morioka City, the regional association, Iwate University, and current catalogues.</text>
</svg>
