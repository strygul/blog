<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Kunzan mark-location and evidence diagram</title><desc id="desc">Retailer-reported Kunzan characters and suggested location, zero independently verified complete-kettle pairs, uncertain confidence, and evidence needed.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4258a8"/></marker></defs>
  <style>.bg{fill:#f2f3fa}.ink{fill:#20243b}.muted{fill:#61657b}.accent{fill:#4258a8}.box{fill:#fff;stroke:#cbd0e6;stroke-width:2}.warn{fill:#f8f4ff;stroke:#4258a8;stroke-width:3;stroke-dasharray:9 7}.title{font:700 38px system-ui,sans-serif}.head{font:700 21px system-ui,sans-serif}.body{font:20px system-ui,sans-serif}.mark{font:700 72px serif}.count{font:700 54px system-ui,sans-serif}.small{font:18px system-ui,sans-serif}</style>
  <rect class="bg" width="1200" height="640" rx="28"/><text x="58" y="70" class="title ink">Kunzan · reported mark, unverified location</text><text x="58" y="105" class="body muted">Dashed pointer = retailer suggestion, not workshop or technical verification.</text>
  <g transform="translate(55 145)"><rect width="440" height="405" rx="20" class="box"/><path d="M105 270Q105 160 225 150Q345 160 345 270Z" fill="#dfe2f2" stroke="#20243b" stroke-width="5"/><path d="M150 152Q225 55 300 152" fill="none" stroke="#20243b" stroke-width="10"/><path d="M344 200Q410 185 414 225Q386 244 345 244" fill="#dfe2f2" stroke="#20243b" stroke-width="5"/><circle cx="327" cy="258" r="11" fill="#fff" stroke="#4258a8" stroke-width="4" stroke-dasharray="4 3"/><path d="M327 258L230 330" fill="none" stroke="#4258a8" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="28" y="355" class="head accent">LOCATION NOT VERIFIED</text><text x="28" y="386" class="body ink">Retail images suggest low near spout</text></g>
  <g transform="translate(530 145)"><rect width="615" height="125" rx="20" class="box"/><text x="28" y="39" class="head muted">RETAILER-REPORTED CHARACTERS</text><text x="28" y="100" class="mark accent">薫山</text><text x="173" y="76" class="head ink">Kunzan</text><text x="173" y="103" class="body muted">sometimes reported with 南部盛岡</text></g>
  <g transform="translate(530 290)"><rect width="285" height="125" rx="20" class="box"/><text x="25" y="38" class="small muted">VERIFIED COMPLETE OBJECTS</text><text x="25" y="101" class="count accent">0</text><text x="82" y="94" class="body ink">mark pairs</text></g>
  <g transform="translate(835 290)"><rect width="310" height="125" rx="20" class="warn"/><text x="25" y="38" class="head accent">CONFIDENCE</text><text x="25" y="83" class="body ink">Uncertain</text><text x="25" y="108" class="small muted">retailer discovery only</text></g>
  <g transform="translate(530 435)"><rect width="615" height="115" rx="20" class="box"/><text x="25" y="38" class="head ink">EVIDENCE NEEDED</text><text x="25" y="72" class="body ink">Workshop or museum whole-object pair;</text><text x="25" y="99" class="body ink">forming method, dated sequence, provenance.</text></g><text x="600" y="605" text-anchor="middle" class="small muted">Resemblance and a seller label do not authenticate an object.</text>
</svg>
