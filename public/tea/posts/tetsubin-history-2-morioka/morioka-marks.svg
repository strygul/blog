<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Evidence limits for four Morioka maker marks</title>
  <desc id="desc">Four concise cards distinguish an academic Suzuki mark record, retailer-reported Kunzan and Kamasada marks, and official detached Iwachu marks. Every maker has zero verified complete-kettle and mark pairs. Full details are in the adjacent HTML table.</desc>
  <rect width="1200" height="540" fill="#f5f0e7"/>
  <style>text{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;fill:#211d19}.title{font:700 38px Georgia,"Noto Serif JP",serif}.sub{font-size:22px;fill:#665d53}.maker{font-size:25px;font-weight:800}.mark{font-family:"Noto Serif JP","Yu Mincho",serif;font-size:48px;font-weight:800}.body{font-size:20px}.card{fill:#fffdf9;stroke:#c9b9a7;stroke-width:2}.zero{fill:#2f3c43}.white{fill:#fff;font-size:22px;font-weight:800}</style>
  <text x="48" y="60" class="title">Marks: source class before resemblance</text>
  <text x="48" y="96" class="sub">Typeset readings, not facsimiles; use the linked source images for letterforms</text>
  <g transform="translate(36 128)"><rect width="270" height="300" rx="10" class="card"/><text x="20" y="42" class="maker">Suzuki Morihisa</text><text x="135" y="106" text-anchor="middle" class="mark">盛久</text><text x="20" y="152" class="body"><tspan x="20">Academic variants;</tspan><tspan x="20" dy="30">wooden seal in mould</tspan></text><rect y="230" width="270" height="70" class="zero"/><text x="20" y="273" class="white">0 VERIFIED PAIRS</text></g>
  <g transform="translate(322 128)"><rect width="270" height="300" rx="10" class="card"/><text x="20" y="42" class="maker">Kunzan</text><text x="135" y="106" text-anchor="middle" class="mark">薫山</text><text x="20" y="152" class="body"><tspan x="20">Retail reports only;</tspan><tspan x="20" dy="30">method + range unknown</tspan></text><rect y="230" width="270" height="70" class="zero"/><text x="20" y="273" class="white">0 VERIFIED PAIRS</text></g>
  <g transform="translate(608 128)"><rect width="270" height="300" rx="10" class="card"/><text x="20" y="42" class="maker">Iwachu</text><text x="135" y="106" text-anchor="middle" class="mark">岩鋳</text><text x="20" y="152" class="body"><tspan x="20">Official current devices;</tspan><tspan x="20" dy="30">detached close-ups;</tspan><tspan x="20" dy="30">location not stated</tspan></text><rect y="230" width="270" height="70" class="zero"/><text x="20" y="273" class="white">0 VERIFIED PAIRS</text></g>
  <g transform="translate(894 128)"><rect width="270" height="300" rx="10" class="card"/><text x="20" y="42" class="maker">Kamasada</text><text x="135" y="106" text-anchor="middle" class="mark">釜定</text><text x="20" y="152" class="body"><tspan x="20">Retail / trade reports;</tspan><tspan x="20" dy="30">method + range unknown</tspan></text><rect y="230" width="270" height="70" class="zero"/><text x="20" y="273" class="white">0 VERIFIED PAIRS</text></g>
  <text x="48" y="478" class="sub">Mark alone is not authentication. Compare the complete object and provenance.</text>
  <text x="48" y="514" class="sub">Full methods, locations, ranges, source classes, and confidence levels follow in HTML.</text>
</svg>
