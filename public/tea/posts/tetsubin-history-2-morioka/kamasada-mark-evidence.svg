<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Kamasada mark-location and evidence diagram</title><desc id="desc">Retailer and trade reported Kamasada characters and locations, zero independently verified complete-kettle pairs, uncertain confidence, and evidence needed.</desc>
  <style>.bg{fill:#f8f2e8}.ink{fill:#3b2a18}.muted{fill:#76644d}.accent{fill:#a4621a}.box{fill:#fff;stroke:#dfcda9;stroke-width:2}.warn{fill:#fff8e8;stroke:#a4621a;stroke-width:3;stroke-dasharray:9 7}.title{font:700 38px system-ui,sans-serif}.head{font:700 21px system-ui,sans-serif}.body{font:20px system-ui,sans-serif}.mark{font:700 54px serif}.latin{font:700 30px system-ui,sans-serif}.count{font:700 54px system-ui,sans-serif}.small{font:18px system-ui,sans-serif}</style>
  <rect class="bg" width="1200" height="640" rx="28"/><text x="58" y="70" class="title ink">Kamasada · reported mark evidence</text><text x="58" y="105" class="body muted">Dashed labels identify retailer/trade reports, not confirmed workshop locations.</text>
  <g transform="translate(55 145)"><rect width="440" height="405" rx="20" class="box"/><path d="M105 270Q105 160 225 150Q345 160 345 270Z" fill="#ecdfc6" stroke="#3b2a18" stroke-width="5"/><path d="M150 152Q225 55 300 152" fill="none" stroke="#3b2a18" stroke-width="10"/><path d="M344 200Q410 185 414 225Q386 244 345 244" fill="#ecdfc6" stroke="#3b2a18" stroke-width="5"/><rect x="38" y="302" width="365" height="76" rx="12" class="warn"/><text x="220" y="332" text-anchor="middle" class="head accent">REPORTED, NOT VERIFIED</text><text x="220" y="360" text-anchor="middle" class="body ink">Below spout · separately beneath lid</text></g>
  <g transform="translate(530 145)"><rect width="615" height="125" rx="20" class="box"/><text x="28" y="38" class="head muted">REPORTED CHARACTERS / READING</text><text x="28" y="100" class="mark accent">南部 釜定</text><text x="285" y="77" class="latin ink">KAMASADA</text><text x="285" y="103" class="small muted">separate Latin system</text></g>
  <g transform="translate(530 290)"><rect width="285" height="125" rx="20" class="box"/><text x="25" y="38" class="small muted">VERIFIED COMPLETE OBJECTS</text><text x="25" y="101" class="count accent">0</text><text x="82" y="94" class="body ink">mark pairs</text></g>
  <g transform="translate(835 290)"><rect width="310" height="125" rx="20" class="warn"/><text x="25" y="38" class="head accent">CONFIDENCE</text><text x="25" y="83" class="body ink">Uncertain</text><text x="25" y="108" class="small muted">retailer / trade discovery</text></g>
  <g transform="translate(530 435)"><rect width="615" height="115" rx="20" class="box"/><text x="25" y="38" class="head ink">EVIDENCE NEEDED</text><text x="25" y="72" class="body ink">Workshop archive or museum whole-object pair;</text><text x="25" y="99" class="body ink">forming method, dated sequence, provenance.</text></g><text x="600" y="605" text-anchor="middle" class="small muted">A reported location cannot fill a missing authentication record.</text>
</svg>
