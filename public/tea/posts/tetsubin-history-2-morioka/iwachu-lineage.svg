<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Iwachu chronology</title>
  <desc id="desc">Four milestones: unresolved company dates of 1901, 1902, and 1908; Iwashimizu Foundry established in 1950; integrated production developed in the early 1970s; and the current active integrated maker.</desc>
  <rect width="1200" height="400" fill="#f5f0e7"/>
  <style>text{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;fill:#211d19}.title{font:700 38px Georgia,"Noto Serif JP",serif}.sub{font-size:22px;fill:#665d53}.year{font-size:28px;font-weight:800;fill:#8a4b2a}.body{font-size:24px}.line{stroke:#9d7458;stroke-width:6}.dot{fill:#8a4b2a;stroke:#f5f0e7;stroke-width:6}</style>
  <text x="54" y="62" class="title">Iwachu — company chronology</text><text x="54" y="98" class="sub">Official English pages preserve three different opening milestones</text>
  <line x1="105" y1="192" x2="1095" y2="192" class="line"/>
  <g text-anchor="middle">
    <circle cx="150" cy="192" r="16" class="dot"/><text x="150" y="154" class="year">1901 / 02 / 08</text><text x="150" y="238" class="body"><tspan x="150">Official dates</tspan><tspan x="150" dy="30">remain unresolved</tspan></text>
    <circle cx="460" cy="192" r="16" class="dot"/><text x="460" y="154" class="year">1950</text><text x="460" y="238" class="body"><tspan x="460">Iwashimizu</tspan><tspan x="460" dy="30">Foundry</tspan></text>
    <circle cx="770" cy="192" r="16" class="dot"/><text x="770" y="154" class="year">Early 1970s</text><text x="770" y="238" class="body"><tspan x="770">Integrated factory</tspan><tspan x="770" dy="30">production expands</tspan></text>
    <circle cx="1060" cy="192" r="16" class="dot"/><text x="1060" y="154" class="year">Current</text><text x="1060" y="238" class="body"><tspan x="1060">Active integrated</tspan><tspan x="1060" dy="30">maker</tspan></text>
  </g>
  <text x="54" y="365" class="sub">The conflicting dates may name different milestones; the sources do not resolve them.</text>
</svg>
