<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Kamasada chronology</title>
  <desc id="desc">Four milestones: Miya family casting in early Meiji, Sadakichi's shop in late Meiji, wartime dismantling in 1945 and rebuilding in 1954, and Miya Nobuho receiving the Yellow Ribbon Medal in 2024.</desc>
  <rect width="1200" height="400" fill="#f5f0e7"/>
  <style>text{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;fill:#211d19}.title{font:700 38px Georgia,"Noto Serif JP",serif}.sub{font-size:22px;fill:#665d53}.year{font-size:28px;font-weight:800;fill:#8a4b2a}.body{font-size:24px}.line{stroke:#9d7458;stroke-width:6}.dot{fill:#8a4b2a;stroke:#f5f0e7;stroke-width:6}</style>
  <text x="54" y="62" class="title">Kamasada — family and workshop record</text><text x="54" y="98" class="sub">Family antecedents, shop history, interruption, and current honor kept distinct</text>
  <line x1="105" y1="192" x2="1095" y2="192" class="line"/>
  <g text-anchor="middle">
    <circle cx="135" cy="192" r="16" class="dot"/><text x="135" y="154" class="year">Early Meiji</text><text x="135" y="238" class="body"><tspan x="135">Miya Gonjirō</tspan><tspan x="135" dy="30">casts in Morioka</tspan></text>
    <circle cx="445" cy="192" r="16" class="dot"/><text x="445" y="154" class="year">Late Meiji</text><text x="445" y="238" class="body"><tspan x="445">Sadakichi's shop</tspan><tspan x="445" dy="30">exact year unstated</tspan></text>
    <circle cx="765" cy="192" r="16" class="dot"/><text x="765" y="154" class="year">1945 → 1954</text><text x="765" y="238" class="body"><tspan x="765">Dismantled, then</tspan><tspan x="765" dy="30">rebuilt</tspan></text>
    <circle cx="1070" cy="192" r="16" class="dot"/><text x="1070" y="154" class="year">2024</text><text x="1070" y="238" class="body"><tspan x="1070">Miya Nobuho:</tspan><tspan x="1070" dy="30">Yellow Ribbon</tspan></text>
  </g>
  <text x="54" y="365" class="sub">The medal is documented; it is not a Living National Treasure designation.</text>
</svg>
