<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Iwachu mark-location and evidence diagram</title><desc id="desc">The official current Japanese and Latin mark devices, location not stated, four detached devices, zero complete-kettle pairs, confidence limits, and evidence needed.</desc>
  <style>.bg{fill:#edf6f4}.ink{fill:#163a36}.muted{fill:#55736f}.accent{fill:#15786f}.box{fill:#fff;stroke:#bdd8d3;stroke-width:2}.warn{fill:#fff8e8;stroke:#15786f;stroke-width:3;stroke-dasharray:9 7}.title{font:700 38px system-ui,sans-serif}.head{font:700 21px system-ui,sans-serif}.body{font:20px system-ui,sans-serif}.mark{font:700 68px serif}.latin{font:700 38px system-ui,sans-serif}.count{font:700 54px system-ui,sans-serif}.small{font:18px system-ui,sans-serif}</style>
  <rect class="bg" width="1200" height="640" rx="28"/><text x="58" y="70" class="title ink">Iwachu · official devices, location not stated</text><text x="58" y="105" class="body muted">No pointer is drawn because the official mark panel does not locate them on a kettle.</text>
  <g transform="translate(55 145)"><rect width="440" height="405" rx="20" class="box"/><path d="M105 270Q105 160 225 150Q345 160 345 270Z" fill="#d3e8e4" stroke="#163a36" stroke-width="5"/><path d="M150 152Q225 55 300 152" fill="none" stroke="#163a36" stroke-width="10"/><path d="M344 200Q410 185 414 225Q386 244 345 244" fill="#d3e8e4" stroke="#163a36" stroke-width="5"/><rect x="65" y="315" width="320" height="55" rx="12" class="warn"/><text x="225" y="350" text-anchor="middle" class="head accent">LOCATION NOT STATED</text></g>
  <g transform="translate(530 145)"><rect width="615" height="125" rx="20" class="box"/><text x="28" y="38" class="head muted">OFFICIAL CURRENT DEVICES</text><text x="28" y="101" class="mark accent">岩鋳</text><text x="172" y="92" class="latin ink">IWACHU</text><text x="390" y="91" class="body muted">four detached designs</text></g>
  <g transform="translate(530 290)"><rect width="285" height="125" rx="20" class="box"/><text x="25" y="38" class="small muted">VERIFIED COMPLETE OBJECTS</text><text x="25" y="101" class="count accent">0</text><text x="82" y="94" class="body ink">mark pairs</text></g>
  <g transform="translate(835 290)"><rect width="310" height="125" rx="20" class="warn"/><text x="25" y="38" class="head accent">CONFIDENCE</text><text x="25" y="75" class="body ink">Current devices documented;</text><text x="25" y="102" class="body ink">isolated attribution uncertain.</text></g>
  <g transform="translate(530 435)"><rect width="615" height="115" rx="20" class="box"/><text x="25" y="38" class="head ink">EVIDENCE NEEDED</text><text x="25" y="72" class="body ink">Official model-level whole-object pairing;</text><text x="25" y="99" class="body ink">location, forming stage, introduction dates.</text></g><text x="600" y="605" text-anchor="middle" class="small muted">Four official devices do not equal four authenticated complete kettles.</text>
</svg>
