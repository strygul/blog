<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Kamasada documented construction and workshop evidence</title><desc id="desc">A diagram showing integrated handwork, fired sand-and-clay mould, casting, approximately 900 degree Celsius yakinuki interior treatment, and exterior lacquer, with differing operation counts and unknown historical coverage marked.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a4621a"/></marker></defs>
  <style>.bg{fill:#f8f2e8}.ink{fill:#3b2a18}.muted{fill:#76644d}.accent{fill:#a4621a}.box{fill:#fff;stroke:#dfcda9;stroke-width:2}.unknown{fill:#fff8e8;stroke:#a4621a;stroke-width:3;stroke-dasharray:10 8}.flow{stroke:#a4621a;stroke-width:4;fill:none;marker-end:url(#arrow)}.title{font:700 38px system-ui,sans-serif}.head{font:700 21px system-ui,sans-serif}.body{font:20px system-ui,sans-serif}.copy{font:17px system-ui,sans-serif}.small{font:18px system-ui,sans-serif}</style>
  <rect class="bg" width="1200" height="640" rx="28"/><text x="58" y="70" class="title ink">Kamasada · integrated construction</text><text x="58" y="106" class="body muted">Institutional accounts count about 40 or 80 operations but agree on the workshop path.</text>
  <g transform="translate(55 170)"><rect width="230" height="160" rx="18" class="box"/><circle cx="52" cy="78" r="22" class="accent"/><path d="M34 118Q52 97 70 118" fill="none" stroke="#a4621a" stroke-width="7"/><text x="160" y="42" text-anchor="middle" class="copy ink"><tspan x="160" font-weight="700">One maker</tspan><tspan x="160" dy="25">carries one piece</tspan><tspan x="160" dy="25">through the chain</tspan></text><text x="160" y="139" text-anchor="middle" class="small muted">Toraya account</text></g><path d="M290 250H335" class="flow"/>
  <g transform="translate(345 170)"><rect width="230" height="160" rx="18" class="box"/><path d="M38 120Q38 48 115 43Q192 48 192 120" fill="none" stroke="#a4621a" stroke-width="7"/><text x="115" y="35" text-anchor="middle" class="head ink">Fired mould</text><text x="115" y="146" text-anchor="middle" class="small muted">Sand + clay</text></g><path d="M580 250H625" class="flow"/>
  <g transform="translate(635 170)"><rect width="230" height="160" rx="18" class="box"/><path d="M64 121Q64 68 115 63Q166 68 166 121Z" fill="#dfcda9" stroke="#3b2a18" stroke-width="4"/><text x="115" y="35" text-anchor="middle" class="head ink">Pour + release</text><text x="115" y="146" text-anchor="middle" class="small muted">Hand operations</text></g><path d="M870 250H915" class="flow"/>
  <g transform="translate(925 170)"><rect width="220" height="160" rx="18" class="box"/><text x="110" y="42" text-anchor="middle" class="head ink">Treat + finish</text><text x="110" y="82" text-anchor="middle" class="body ink">Yakinuki ≈ 900°C</text><text x="110" y="112" text-anchor="middle" class="body ink">Exterior lacquer</text><text x="110" y="143" text-anchor="middle" class="small muted">JEF account</text></g>
  <g transform="translate(155 410)"><rect width="890" height="142" rx="18" class="unknown"/><text x="35" y="42" class="head accent">LIMIT + UNKNOWN</text><text x="35" y="78" class="body ink">≈40 and ≈80 use different operation granularity · neither count is a universal rule</text><text x="35" y="108" class="body ink">Coverage of every product and historical kettle · mark-forming method · original fittings</text></g><text x="600" y="605" text-anchor="middle" class="small muted">Original schematic; documented operations only, with disagreement exposed.</text>
