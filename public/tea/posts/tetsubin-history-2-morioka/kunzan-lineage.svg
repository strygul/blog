<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Kunzan chronology</title>
  <desc id="desc">Four milestones: founder Asada Kaoru born in 1904, the workshop established in 1937 after Suzuki Shuzendo training, Sasaki Kazuo becoming third Kunzan in 1976, and national traditional craftsperson recognition in 1994.</desc>
  <rect width="1200" height="400" fill="#f5f0e7"/>
  <style>text{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;fill:#211d19}.title{font:700 38px Georgia,"Noto Serif JP",serif}.sub{font-size:22px;fill:#665d53}.year{font-size:29px;font-weight:800;fill:#8a4b2a}.body{font-size:24px}.line{stroke:#9d7458;stroke-width:6}.dot{fill:#8a4b2a;stroke:#f5f0e7;stroke-width:6}</style>
  <text x="54" y="62" class="title">Kunzan — workshop chronology</text><text x="54" y="98" class="sub">A twentieth-century apprenticeship branch, not an ancient dynasty</text>
  <line x1="105" y1="192" x2="1095" y2="192" class="line"/>
  <g text-anchor="middle">
    <circle cx="130" cy="192" r="16" class="dot"/><text x="130" y="154" class="year">1904</text><text x="130" y="238" class="body"><tspan x="130">Asada Kaoru</tspan><tspan x="130" dy="30">born</tspan></text>
    <circle cx="450" cy="192" r="16" class="dot"/><text x="450" y="154" class="year">1937</text><text x="450" y="238" class="body"><tspan x="450">Own workshop</tspan><tspan x="450" dy="30">established</tspan></text>
    <circle cx="770" cy="192" r="16" class="dot"/><text x="770" y="154" class="year">1976</text><text x="770" y="238" class="body"><tspan x="770">Sasaki Kazuo</tspan><tspan x="770" dy="30">becomes 3rd Kunzan</tspan></text>
    <circle cx="1070" cy="192" r="16" class="dot"/><text x="1070" y="154" class="year">1994</text><text x="1070" y="238" class="body"><tspan x="1070">Traditional-craft</tspan><tspan x="1070" dy="30">recognition</tspan></text>
  </g>
  <text x="54" y="365" class="sub">Active at Morioka Handi-Works Square; apprenticeship does not transfer authorship.</text>
</svg>
