<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Iwachu documented kettle and teapot production routes</title><desc id="desc">A split diagram contrasting the documented fired-mould, hand-patterned tetsubin route with automated moulding and enamel interior for teapots and kitchenware, plus unknown model routing and mark stage.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15786f"/></marker></defs>
  <style>.bg{fill:#edf6f4}.ink{fill:#163a36}.muted{fill:#55736f}.accent{fill:#15786f}.box{fill:#fff;stroke:#bdd8d3;stroke-width:2}.unknown{fill:#fff8e8;stroke:#15786f;stroke-width:3;stroke-dasharray:10 8}.flow{stroke:#15786f;stroke-width:4;fill:none;marker-end:url(#arrow)}.title{font:700 38px system-ui,sans-serif}.lane{font:700 23px system-ui,sans-serif}.body{font:20px system-ui,sans-serif}.small{font:18px system-ui,sans-serif}</style>
  <rect class="bg" width="1200" height="640" rx="28"/><text x="58" y="70" class="title ink">Iwachu · two documented production routes</text><text x="58" y="106" class="body muted">Product type and interior treatment determine use; the brand name alone does not.</text>
  <rect x="55" y="145" width="1090" height="165" rx="20" class="box"/><rect x="55" y="145" width="235" height="165" rx="20" class="accent"/><text x="172" y="205" text-anchor="middle" class="lane" fill="#fff">TETSUBIN</text><text x="172" y="237" text-anchor="middle" class="small" fill="#fff">water boiler</text><text x="172" y="268" text-anchor="middle" class="small" fill="#fff">traditional yakigata page</text><text x="335" y="207" class="body ink">Profile template</text><text x="335" y="240" class="body ink">Hand pattern</text><path d="M465 225H525" class="flow"/><text x="550" y="207" class="body ink">Fire mould</text><text x="550" y="240" class="body ink">Assemble + pour</text><path d="M710 225H770" class="flow"/><text x="795" y="207" class="body ink">Oxide-treated interior</text><text x="795" y="240" class="body ink">Lacquer exterior</text><text x="795" y="274" class="small muted">No enamel stated for this route</text>
  <rect x="55" y="330" width="1090" height="145" rx="20" class="box"/><rect x="55" y="330" width="235" height="145" rx="20" fill="#4c918b"/><text x="172" y="385" text-anchor="middle" class="lane" fill="#fff">TEAPOT /</text><text x="172" y="415" text-anchor="middle" class="lane" fill="#fff">KITCHENWARE</text><text x="330" y="385" class="body ink">Automated moulding</text><path d="M505 395H575" class="flow"/><text x="600" y="385" class="body ink">Enamelled interior</text><path d="M770 395H840" class="flow"/><text x="865" y="385" class="body ink">Steeping vessel</text><text x="865" y="418" class="body ink">No direct flame</text>
  <g transform="translate(185 510)"><rect width="830" height="82" rx="18" class="unknown"/><text x="28" y="33" class="lane accent">UNKNOWN</text><text x="28" y="62" class="body ink">Exact model routing · mark-forming stage · complete object/mark pairings</text></g><text x="600" y="623" text-anchor="middle" class="small muted">Original process schematic based only on Iwachu’s published process and care pages.</text>
</svg>
