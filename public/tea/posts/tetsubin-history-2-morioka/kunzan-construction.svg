  <g transform="translate(360 170)"><rect width="240" height="160" rx="18" class="box"/><path d="M42 120Q42 48 120 43Q198 48 198 120" fill="none" stroke="#4258a8" stroke-width="7"/><path d="M103 49L128 82L108 105L145 130" fill="none" stroke="#20243b" stroke-width="4"/><text x="120" y="35" text-anchor="middle" class="head ink">Fire + break mould</text><text x="120" y="148" text-anchor="middle" class="small muted">Single casting release</text></g><path d="M605 250H655" class="flow"/>
  <g transform="translate(665 170)"><rect width="240" height="160" rx="18" class="box"/><path d="M68 121Q68 68 120 63Q172 68 172 121Z" fill="#cbd0e6" stroke="#20243b" stroke-width="4"/><text x="120" y="35" text-anchor="middle" class="head ink">Cast in-house</text><text x="120" y="148" text-anchor="middle" class="small muted">Workshop claim</text></g><path d="M910 250H960" class="flow"/>
  <g transform="translate(970 170)"><rect width="175" height="160" rx="18" class="box"/><path d="M38 104Q88 34 138 104" fill="none" stroke="#20243b" stroke-width="8"/><rect x="61" y="101" width="54" height="16" rx="8" class="accent"/><text x="88" y="35" text-anchor="middle" class="head ink">Fittings</text><text x="88" y="145" text-anchor="middle" class="small muted">Handle may be specialist</text></g>
  <g transform="translate(170 410)"><rect width="860" height="142" rx="18" class="unknown"/><text x="35" y="42" class="head accent">UNKNOWN — verify object by object</text><text x="35" y="78" class="body ink">Role split · process coverage for catalogue or older kettles</text><text x="35" y="108" class="body ink">Mark method and sequence · whether fittings are original</text></g><text x="600" y="605" text-anchor="middle" class="small muted">Manufacturer specifications describe Kunzan kettles, not all Nambu ironware.</text>
