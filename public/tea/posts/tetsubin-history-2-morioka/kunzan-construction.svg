<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Kunzan documented construction and workshop evidence</title><desc id="desc">A diagram showing manual patterning, fired and broken mould, in-house casting, and separately fitted parts, with unknown exact role divisions and historical continuity marked.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4258a8"/></marker></defs>
  <style>.bg{fill:#f2f3fa}.ink{fill:#20243b}.muted{fill:#61657b}.accent{fill:#4258a8}.box{fill:#fff;stroke:#cbd0e6;stroke-width:2}.unknown{fill:#f8f4ff;stroke:#4258a8;stroke-width:3;stroke-dasharray:10 8}.flow{stroke:#4258a8;stroke-width:4;fill:none;marker-end:url(#arrow)}.title{font:700 38px system-ui,sans-serif}.head{font:700 21px system-ui,sans-serif}.body{font:20px system-ui,sans-serif}.small{font:18px system-ui,sans-serif}</style>
  <rect class="bg" width="1200" height="640" rx="28"/><text x="58" y="70" class="title ink">Kunzan · documented in-house casting path</text><text x="58" y="106" class="body muted">The workshop statement supports these stages, not a one-person claim.</text>
