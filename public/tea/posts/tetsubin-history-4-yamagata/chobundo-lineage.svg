<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Chobundo chronology</title><desc id="desc">Chobundo's source-qualified workshop sequence records first-generation training around 1945, establishment in 1952, second-generation naming, and a third-generation current maker in the export record.</desc><style>.bg{fill:#f4efe5}.h{font:700 32px Georgia,serif;fill:#231f1b}.b{font:18px Arial,sans-serif;fill:#28231f}.s{font:16px Arial,sans-serif;fill:#62594f}.d{font:700 22px Arial,sans-serif;fill:#7b2f26}.c{fill:#fff;stroke:#c9bba7;stroke-width:2}.l{stroke:#9b4f3f;stroke-width:6}</style><rect class="bg" width="1200" height="500"/><text class="h" x="55" y="58">Chobundo: a postwar, kettle-focused workshop record</text><text class="s" x="55" y="88">Workshop account in prefectural export catalogue; no regional age is borrowed as a company date.</text><line class="l" x1="100" y1="245" x2="1100" y2="245"/><g><circle fill="#9b4f3f" cx="155" cy="245" r="12"/><rect class="c" x="55" y="285" width="225" height="105" rx="8"/><text class="d" x="78" y="320">around 1945</text><text class="b" x="78" y="350">Choroku trains / manages</text><text class="s" x="78" y="376">workshop-reported</text></g><g><circle fill="#9b4f3f" cx="440" cy="245" r="12"/><rect class="c" x="325" y="110" width="235" height="105" rx="8"/><text class="d" x="348" y="145">1952</text><text class="b" x="348" y="175">Chobundo established</text><text class="s" x="348" y="201">main product: iron kettle</text></g><g><circle fill="#9b4f3f" cx="725" cy="245" r="12"/><rect class="c" x="610" y="285" width="230" height="105" rx="8"/><text class="d" x="633" y="320">second generation</text><text class="b" x="633" y="350">Fumio names studio</text><text class="s" x="633" y="376">after Choroku’s death</text></g><g><circle fill="#9b4f3f" cx="1000" cy="245" r="12"/><rect class="c" x="880" y="110" width="265" height="105" rx="8"/><text class="d" x="903" y="145">current record</text><text class="b" x="903" y="175">Mitsuaki Hasegawa</text><text class="s" x="903" y="201">third-generation maker</text></g><text class="s" x="55" y="450">A documented 1952 studio can carry regional skill without claiming the region’s nine-century origin as its own.</text></svg>
