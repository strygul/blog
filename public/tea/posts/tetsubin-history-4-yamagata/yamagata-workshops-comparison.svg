<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Three Yamagata workshops compared</title><desc id="desc">Three equal columns compare Seikodo, Kikuchi Hojudo, and Chobundo by documented start, tetsubin relationship, process evidence, visual language, fittings, and current evidence limit.</desc><style>.bg{fill:#f4efe5}.h{font:700 32px Georgia,serif;fill:#231f1b}.s{font:15px Arial,sans-serif;fill:#62594f}.t{font:700 23px Arial,sans-serif;fill:#fff}.k{font:700 16px Arial,sans-serif;fill:#7b2f26}.b{font:16px Arial,sans-serif;fill:#28231f}.c{fill:#fff;stroke:#c9bba7;stroke-width:2}.row{stroke:#dfd4c3;stroke-width:1}</style><rect class="bg" width="1200" height="820"/><text class="h" x="45" y="53">Yamagata: three workshops, three documented continuities</text><text class="s" x="45" y="80">Equal fields; source limits are part of the comparison. Full readable text is adjacent in the article.</text><rect x="45" y="110" width="350" height="52" rx="8" fill="#9b4f3f"/><text class="t" x="70" y="144">Seikodo</text><rect x="425" y="110" width="350" height="52" rx="8" fill="#315d64"/><text class="t" x="450" y="144">Kikuchi Hojudo</text><rect x="805" y="110" width="350" height="52" rx="8" fill="#7b6a4d"/><text class="t" x="830" y="144">Chobundo</text><rect class="c" x="45" y="180" width="350" height="560" rx="8"/><rect class="c" x="425" y="180" width="350" height="560" rx="8"/><rect class="c" x="805" y="180" width="350" height="560" rx="8"/><g><text class="k" x="70" y="215">DOCUMENTED START</text><text class="b" x="70" y="240">1735; company 1966</text><text class="k" x="70" y="290">TETSUBIN RELATIONSHIP</text><text class="b" x="70" y="315">workshop account; later</text><text class="b" x="70" y="337">chagama specialty</text><text class="k" x="70" y="387">MOULD / PROCESS</text><text class="b" x="70" y="412">named lost-wax models;</text><text class="b" x="70" y="434">hand-pressed arare</text><text class="k" x="70" y="484">SURFACE LANGUAGE</text><text class="b" x="70" y="509">relief, arare, iron sand,</text><text class="b" x="70" y="531">inlay, exact forms</text><text class="k" x="70" y="581">LID / HANDLE</text><text class="b" x="70" y="606">copper/silver or iron-sand</text><text class="k" x="70" y="656">CURRENT LIMIT</text><text class="b" x="70" y="681">no published kettle-mark</text><text class="b" x="70" y="703">whole-object pairs</text></g><g><text class="k" x="450" y="215">DOCUMENTED START</text><text class="b" x="450" y="240">oldest written record: 1604</text><text class="k" x="450" y="290">TETSUBIN RELATIONSHIP</text><text class="b" x="450" y="315">shrine then daily wares;</text><text class="b" x="450" y="337">not a 1604 tetsubin date</text><text class="k" x="450" y="387">MOULD / PROCESS</text><text class="b" x="450" y="412">apprenticeship documented;</text><text class="b" x="450" y="434">model route unknown</text><text class="k" x="450" y="484">SURFACE LANGUAGE</text><text class="b" x="450" y="509">traditional and colored</text><text class="b" x="450" y="531">contemporary teapots</text><text class="k" x="450" y="581">LID / HANDLE</text><text class="b" x="450" y="606">sword-inspired handles reported</text><text class="k" x="450" y="656">CURRENT LIMIT</text><text class="b" x="450" y="681">no published kettle-mark</text><text class="b" x="450" y="703">whole-object pairs</text></g><g><text class="k" x="830" y="215">DOCUMENTED START</text><text class="b" x="830" y="240">1952</text><text class="k" x="830" y="290">TETSUBIN RELATIONSHIP</text><text class="b" x="830" y="315">published studio account is</text><text class="b" x="830" y="337">kettle-focused</text><text class="k" x="830" y="387">MOULD / PROCESS</text><text class="b" x="830" y="412">thin walls, named one-use</text><text class="b" x="830" y="434">moulds, lacquer finish</text><text class="k" x="830" y="484">SURFACE LANGUAGE</text><text class="b" x="830" y="509">plain Natsume, arare,</text><text class="b" x="830" y="531">pictorial relief</text><text class="k" x="830" y="581">LID / HANDLE</text><text class="b" x="830" y="606">handmade spout; named lids</text><text class="k" x="830" y="656">CURRENT LIMIT</text><text class="b" x="830" y="681">no published kettle-mark</text><text class="b" x="830" y="703">whole-object pairs</text></g><text class="s" x="45" y="785">No column supplies a visual attribution rule. A complete kettle, its construction, its documented mark, and provenance are still required.</text></svg>
