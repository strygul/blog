<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Seikodo surface and material range</title><desc id="desc">A source card groups Seikodo's documented current surface families without treating any as a unique maker signature.</desc><style>.bg{fill:#f4efe5}.h{font:700 32px Georgia,serif;fill:#231f1b}.b{font:18px Arial,sans-serif;fill:#28231f}.s{font:16px Arial,sans-serif;fill:#62594f}.c{fill:#fff;stroke:#c9bba7;stroke-width:2}.t{font:700 20px Arial,sans-serif;fill:#fff}</style><rect class="bg" width="1200" height="440"/><text class="h" x="55" y="58">Seikodo: a current catalogue is a range, not a style test</text><rect x="55" y="105" width="330" height="50" rx="8" fill="#9b4f3f"/><text class="t" x="82" y="138">Moulded / pressed</text><rect class="c" x="55" y="170" width="330" height="145" rx="8"/><text class="b" x="82" y="210">hand-pressed arare</text><text class="b" x="82" y="245">combed horizontal bands</text><rect x="435" y="105" width="330" height="50" rx="8" fill="#315d64"/><text class="t" x="462" y="138">Relief / inlay</text><rect class="c" x="435" y="170" width="330" height="145" rx="8"/><text class="b" x="462" y="210">dragons, landscapes, flowers</text><text class="b" x="462" y="245">gold and silver inlay examples</text><rect x="815" y="105" width="330" height="50" rx="8" fill="#7b6a4d"/><text class="t" x="842" y="138">Silhouette / material</text><rect class="c" x="815" y="170" width="330" height="145" rx="8"/><text class="b" x="842" y="210">natsume, octagonal, hiramaru</text><text class="b" x="842" y="245">cast iron and iron-sand examples</text><text class="s" x="55" y="380">Source: 2024 prefectural catalogue. A shared motif or material cannot authenticate an unknown kettle.</text></svg>
