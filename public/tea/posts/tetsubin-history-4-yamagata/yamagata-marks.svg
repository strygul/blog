<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Yamagata maker-mark evidence ceiling</title><desc id="desc">Three equal cards record documented workshop names for Seikodo, Kikuchi Hojudo, and Chobundo, while showing that accessible sources do not establish their tetsubin mark techniques, locations, date ranges, or complete-object pairs.</desc><style>.bg{fill:#f4efe5}.h{font:700 32px Georgia,serif;fill:#231f1b}.s{font:15px Arial,sans-serif;fill:#62594f}.t{font:700 22px Arial,sans-serif;fill:#fff}.k{font:700 16px Arial,sans-serif;fill:#7b2f26}.b{font:16px Arial,sans-serif;fill:#28231f}.c{fill:#fff;stroke:#c9bba7;stroke-width:2}.w{fill:#fff3d9;stroke:#d3a03c;stroke-width:2}</style><rect class="bg" width="1200" height="700"/><text class="h" x="45" y="55">Maker marks: the honest comparison is an evidence ceiling</text><text class="s" x="45" y="82">Names are typeset readings, not seal facsimiles. Every field has an adjacent readable table in the article.</text><rect x="45" y="110" width="350" height="50" rx="8" fill="#9b4f3f"/><text class="t" x="70" y="143">Seikodo</text><rect x="425" y="110" width="350" height="50" rx="8" fill="#315d64"/><text class="t" x="450" y="143">Kikuchi Hojudo</text><rect x="805" y="110" width="350" height="50" rx="8" fill="#7b6a4d"/><text class="t" x="830" y="143">Chobundo</text><g><rect class="c" x="45" y="180" width="350" height="355" rx="8"/><text class="k" x="70" y="220">DOCUMENTED NAME</text><text class="b" x="70" y="248">清光堂 · Seikōdō / Seikodo</text><text class="k" x="70" y="295">TECHNIQUE / LOCATION</text><text class="b" x="70" y="323">not established for tetsubin</text><text class="k" x="70" y="370">DATE RANGE</text><text class="b" x="70" y="398">1735 start ≠ mark date</text><text class="k" x="70" y="445">WHOLE-OBJECT PAIRS</text><text class="b" x="70" y="473">0 verified kettle + mark pairs</text></g><g><rect class="c" x="425" y="180" width="350" height="355" rx="8"/><text class="k" x="450" y="220">DOCUMENTED NAME</text><text class="b" x="450" y="248">菊地保寿堂 · Kikuchi Hojudo</text><text class="k" x="450" y="295">TECHNIQUE / LOCATION</text><text class="b" x="450" y="323">not established for tetsubin</text><text class="k" x="450" y="370">DATE RANGE</text><text class="b" x="450" y="398">1604 record ≠ mark date</text><text class="k" x="450" y="445">WHOLE-OBJECT PAIRS</text><text class="b" x="450" y="473">0 verified kettle + mark pairs</text></g><g><rect class="c" x="805" y="180" width="350" height="355" rx="8"/><text class="k" x="830" y="220">DOCUMENTED NAME</text><text class="b" x="830" y="248">長文堂 · Chōbundō / Chobundo</text><text class="k" x="830" y="295">TECHNIQUE / LOCATION</text><text class="b" x="830" y="323">not established for tetsubin</text><text class="k" x="830" y="370">DATE RANGE</text><text class="b" x="830" y="398">1952 start ≠ mark date</text><text class="k" x="830" y="445">WHOLE-OBJECT PAIRS</text><text class="b" x="830" y="473">0 verified kettle + mark pairs</text></g><rect class="w" x="45" y="570" width="1110" height="80" rx="8"/><text class="b" x="72" y="607">Warning: lids, handles, boxes and certificates may be replacements or later pairings; a signed lid does not authenticate the body.</text><text class="b" x="72" y="635">Marks can be copied and workshops made unmarked work. Regional style alone cannot prove maker, origin, date, or assembly.</text></svg>
