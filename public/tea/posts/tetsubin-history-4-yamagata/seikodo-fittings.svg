<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Seikodo documented fittings</title><desc id="desc">A text-card comparison of documented Seikodo lids and knobs from named current catalogue products.</desc><style>.bg{fill:#f4efe5}.h{font:700 30px Georgia,serif;fill:#231f1b}.b{font:18px Arial,sans-serif;fill:#28231f}.s{font:16px Arial,sans-serif;fill:#62594f}.k{font:700 18px Arial,sans-serif;fill:#7b2f26}.c{fill:#fff;stroke:#c9bba7;stroke-width:2}</style><rect class="bg" width="1200" height="440"/><text class="h" x="55" y="58">Seikodo: documented fittings</text><rect class="c" x="55" y="105" width="515" height="210" rx="8"/><text class="k" x="82" y="145">COPPER + SILVER CONTEXT</text><text class="b" x="82" y="185">Hakkakkei-odare: vermilion copper lid</text><text class="b" x="82" y="220">with silver pine-needle knob.</text><text class="b" x="82" y="255">Kiku-gata: silver plum-blossom top.</text><rect class="c" x="630" y="105" width="515" height="210" rx="8"/><text class="k" x="657" y="145">IRON-SAND CONTEXT</text><text class="b" x="657" y="185">Named iron-sand kettles also have</text><text class="b" x="657" y="220">iron-sand lids in the export catalogue.</text><text class="b" x="657" y="255">The fitting belongs to a model record.</text><text class="s" x="55" y="380">A lid or handle without the complete object, model record, and provenance does not prove the cast body.</text></svg>
