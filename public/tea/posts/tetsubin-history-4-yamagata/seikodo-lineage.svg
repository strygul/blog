<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Seikodo chronology</title><desc id="desc">A source-qualified Seikodo timeline: documented start in 1735, company incorporation in 1966, later chagama specialization, and recorded tetsubin expansion from the 1990s.</desc><style>.bg{fill:#f4efe5}.h{font:700 32px Georgia,serif;fill:#231f1b}.s{font:17px Arial,sans-serif;fill:#62594f}.d{font:700 22px Arial,sans-serif;fill:#7b2f26}.b{font:18px Arial,sans-serif;fill:#28231f}.c{fill:#fff;stroke:#c9bba7;stroke-width:2}.l{stroke:#9b4f3f;stroke-width:6}</style><rect class="bg" width="1200" height="500"/><text class="h" x="55" y="58">Seikodo: a dated house record, not a blanket object date</text><text class="s" x="55" y="88">Government-hosted export profile; family-history details are workshop-reported.</text><line class="l" x1="100" y1="245" x2="1100" y2="245"/><g><circle fill="#9b4f3f" cx="155" cy="245" r="12"/><rect class="c" x="55" y="285" width="225" height="105" rx="8"/><text class="d" x="78" y="320">1735</text><text class="b" x="78" y="350">documented start</text><text class="s" x="78" y="376">not every kettle dated</text></g><g><circle fill="#9b4f3f" cx="430" cy="245" r="12"/><rect class="c" x="315" y="110" width="235" height="100" rx="8"/><text class="d" x="338" y="145">postwar record</text><text class="b" x="338" y="175">chagama specialty</text><text class="s" x="338" y="200">workshop account</text></g><g><circle fill="#9b4f3f" cx="700" cy="245" r="12"/><rect class="c" x="585" y="285" width="235" height="105" rx="8"/><text class="d" x="608" y="320">1966</text><text class="b" x="608" y="350">company established</text><text class="s" x="608" y="376">distinct from 1735</text></g><g><circle fill="#9b4f3f" cx="1000" cy="245" r="12"/><rect class="c" x="875" y="110" width="270" height="100" rx="8"/><text class="d" x="898" y="145">from the 1990s</text><text class="b" x="898" y="175">recorded tetsubin demand</text><text class="s" x="898" y="200">nearly 100 types reported</text></g><text class="s" x="55" y="450">Evidence ceiling: a workshop chronology and current catalogue, not a production record for an isolated historical object.</text></svg>
