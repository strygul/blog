<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Seikodo process evidence</title><desc id="desc">Seikodo's export catalogue documents lost-wax casting for named models and hand-pressed arare for another; neither process is assigned to all workshop objects.</desc><style>.bg{fill:#f4efe5}.h{font:700 32px Georgia,serif;fill:#231f1b}.b{font:18px Arial,sans-serif;fill:#28231f}.s{font:16px Arial,sans-serif;fill:#62594f}.t{font:700 22px Arial,sans-serif;fill:#fff}.c{fill:#fff;stroke:#c9bba7;stroke-width:2}.w{fill:#fff3d9;stroke:#d3a03c;stroke-width:2;stroke-dasharray:9 7}</style><rect class="bg" width="1200" height="520"/><text class="h" x="55" y="58">Seikodo: process claims attach to named models</text><rect x="55" y="100" width="510" height="50" rx="8" fill="#9b4f3f"/><text class="t" x="82" y="133">Documented in the export catalogue</text><rect class="c" x="55" y="170" width="510" height="205" rx="8"/><text class="b" x="82" y="215">• “Wax type” kettles: lost-wax casting stated</text><text class="b" x="82" y="255">• dragon / lion-and-peony / dragon-spout models</text><text class="b" x="82" y="295">• hiramaru: hand-pressed arare stated</text><text class="s" x="82" y="335">Materials and fittings vary by named model.</text><rect x="635" y="100" width="510" height="50" rx="8" fill="#315d64"/><text class="t" x="662" y="133">Do not generalize from appearance</text><rect class="w" x="635" y="170" width="510" height="205" rx="8"/><text class="b" x="662" y="215">Not established: every Seikodo object = lost wax</text><text class="b" x="662" y="255">Not established: elaborate relief = lost wax</text><text class="b" x="662" y="295">Not established: historic route from a loose lid</text><text class="s" x="662" y="335">Evidence needed: complete object + dated model record.</text><text class="s" x="55" y="450">Lost wax is an evidenced route here—not a visual adjective or a general Yamagata attribution rule.</text></svg>
