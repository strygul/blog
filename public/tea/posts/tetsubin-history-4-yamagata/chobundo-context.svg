<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Chobundo surface and use contexts</title><desc id="desc">A source card compares Chobundo's plain tall Natsume, patterned Komagata, and pictorial Zakuro current catalogue contexts.</desc><style>.bg{fill:#f4efe5}.h{font:700 32px Georgia,serif;fill:#231f1b}.b{font:18px Arial,sans-serif;fill:#28231f}.s{font:16px Arial,sans-serif;fill:#62594f}.c{fill:#fff;stroke:#c9bba7;stroke-width:2}.t{font:700 20px Arial,sans-serif;fill:#fff}</style><rect class="bg" width="1200" height="430"/><text class="h" x="55" y="58">Chobundo: current surface language spans plain, patterned, and pictorial bodies</text><rect x="55" y="105" width="330" height="50" rx="8" fill="#9b4f3f"/><text class="t" x="82" y="138">Plain Natsume</text><rect class="c" x="55" y="170" width="330" height="125" rx="8"/><text class="b" x="82" y="210">tall vertical silhouette</text><text class="b" x="82" y="245">casting surface foregrounded</text><rect x="435" y="105" width="330" height="50" rx="8" fill="#315d64"/><text class="t" x="462" y="138">Komagata</text><rect class="c" x="435" y="170" width="330" height="125" rx="8"/><text class="b" x="462" y="210">arare with small plant detail</text><text class="b" x="462" y="245">named current object</text><rect x="815" y="105" width="330" height="50" rx="8" fill="#7b6a4d"/><text class="t" x="842" y="138">Zakuro / Kiku</text><rect class="c" x="815" y="170" width="330" height="125" rx="8"/><text class="b" x="842" y="210">pomegranate/bee or floral relief</text><text class="b" x="842" y="245">named current object</text><text class="s" x="55" y="370">The range prevents surface-only attribution. Source: 2024 prefectural catalogue.</text></svg>
