<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Chobundo representative current objects</title><desc id="desc">A source card records three current Chobundo kettle models from the 2024 Yamagata export catalogue.</desc><style>.bg{fill:#f4efe5}.h{font:700 32px Georgia,serif;fill:#231f1b}.b{font:18px Arial,sans-serif;fill:#28231f}.s{font:16px Arial,sans-serif;fill:#62594f}.c{fill:#fff;stroke:#c9bba7;stroke-width:2}.k{font:700 18px Arial,sans-serif;fill:#7b2f26}</style><rect class="bg" width="1200" height="440"/><text class="h" x="55" y="58">Chobundo: representative current kettles in the 2024 prefectural catalogue</text><rect class="c" x="55" y="105" width="330" height="210" rx="8"/><text class="k" x="82" y="145">NATSUME</text><text class="b" x="82" y="180">1.5 L · 1.4 kg</text><text class="b" x="82" y="215">founder design; tall body</text><text class="s" x="82" y="255">thin-wall claim stated</text><rect class="c" x="435" y="105" width="330" height="210" rx="8"/><text class="k" x="462" y="145">KODAI HIRAMARU</text><text class="b" x="462" y="180">1.5 L · 1.6 kg</text><text class="b" x="462" y="215">flat, round, plain body</text><text class="s" x="462" y="255">one-use mould stated</text><rect class="c" x="815" y="105" width="330" height="210" rx="8"/><text class="k" x="842" y="145">KOMAGATA</text><text class="b" x="842" y="180">2 L · 1.7 kg</text><text class="b" x="842" y="215">arare; pine-cone knob</text><text class="s" x="842" y="255">one-use mould stated</text><text class="s" x="55" y="380">Secure context: named current Chobundo products, prefectural catalogue (2024). No product photograph was traced.</text></svg>
