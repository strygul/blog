<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Kikuchi Hojudo chronology</title><desc id="desc">Kikuchi Hojudo's oldest written foundry record dates to 1604. The government feature records shrine goods, later domestic wares, wartime grenade production, and a postwar return.</desc><style>.bg{fill:#f4efe5}.h{font:700 32px Georgia,serif;fill:#231f1b}.b{font:18px Arial,sans-serif;fill:#28231f}.s{font:16px Arial,sans-serif;fill:#62594f}.d{font:700 22px Arial,sans-serif;fill:#7b2f26}.c{fill:#fff;stroke:#c9bba7;stroke-width:2}.l{stroke:#315d64;stroke-width:6}</style><rect class="bg" width="1200" height="500"/><text class="h" x="55" y="58">Kikuchi Hojudo: the written record starts with a foundry</text><text class="s" x="55" y="88">Government feature, 2011; it does not make 1604 a tetsubin or mark date.</text><line class="l" x1="100" y1="250" x2="1100" y2="250"/><g><circle fill="#315d64" cx="150" cy="250" r="12"/><rect class="c" x="55" y="290" width="230" height="105" rx="8"/><text class="d" x="78" y="325">1604</text><text class="b" x="78" y="355">oldest written record</text><text class="s" x="78" y="381">17 people, cast goods</text></g><g><circle fill="#315d64" cx="440" cy="250" r="12"/><rect class="c" x="325" y="110" width="235" height="105" rx="8"/><text class="d" x="348" y="145">later record</text><text class="b" x="348" y="175">shrine → daily wares</text><text class="s" x="348" y="201">teapots and sake ware</text></g><g><circle fill="#315d64" cx="725" cy="250" r="12"/><rect class="c" x="610" y="290" width="230" height="105" rx="8"/><text class="d" x="633" y="325">wartime</text><text class="b" x="633" y="355">grenade production</text><text class="s" x="633" y="381">reported interruption</text></g><g><circle fill="#315d64" cx="1000" cy="250" r="12"/><rect class="c" x="880" y="110" width="265" height="105" rx="8"/><text class="d" x="903" y="145">postwar / 2011</text><text class="b" x="903" y="175">return to core products</text><text class="s" x="903" y="201">15th generation reported</text></g><text class="s" x="55" y="450">“History older than 1604” remains a family statement; no earlier surviving record is supplied here.</text></svg>
