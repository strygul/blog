<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Seikodo representative current objects</title><desc id="desc">A source card for named Seikodo iron kettles in the 2024 Yamagata export catalogue, including wax-type relief and hand-pressed arare examples.</desc><style>.bg{fill:#f4efe5}.h{font:700 32px Georgia,serif;fill:#231f1b}.b{font:18px Arial,sans-serif;fill:#28231f}.s{font:16px Arial,sans-serif;fill:#62594f}.c{fill:#fff;stroke:#c9bba7;stroke-width:2}.k{font:700 18px Arial,sans-serif;fill:#7b2f26}</style><rect class="bg" width="1200" height="480"/><text class="h" x="55" y="58">Seikodo: representative objects in the 2024 prefectural catalogue</text><rect class="c" x="55" y="105" width="330" height="245" rx="8"/><text class="k" x="82" y="145">WAX TYPE: RYŪ-GUCHI</text><text class="b" x="82" y="180">dragon-head spout; dragon relief</text><text class="b" x="82" y="210">cast iron, copper, silver</text><text class="s" x="82" y="245">19.5 × 21.5 cm · 1.65 kg</text><text class="s" x="82" y="275">lost-wax stated by catalogue</text><rect class="c" x="435" y="105" width="330" height="245" rx="8"/><text class="k" x="462" y="145">FUKU-ARARE</text><text class="b" x="462" y="180">hiramaru body</text><text class="b" x="462" y="210">all-over hand-pressed arare</text><text class="s" x="462" y="245">18 × 20 cm · 1.7 kg</text><text class="s" x="462" y="275">current catalogue description</text><rect class="c" x="815" y="105" width="330" height="245" rx="8"/><text class="k" x="842" y="145">Hakkakkei-odare</text><text class="b" x="842" y="180">octagonal iron kettle</text><text class="b" x="842" y="210">vermilion copper lid; silver knob</text><text class="s" x="842" y="245">18 × 23 cm · 1.9 kg</text><text class="s" x="842" y="275">current catalogue description</text><text class="s" x="55" y="415">Secure context: current Seikodo products, Yamagata export catalogue (2024). Schematic text card; no product image traced.</text></svg>
